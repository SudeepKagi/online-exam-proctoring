global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: 'proctornet-backend'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['backend:5000', 'host.docker.internal:5000', 'localhost:5000']
        labels:
          app: 'proctornet-api'
          environment: 'production'
