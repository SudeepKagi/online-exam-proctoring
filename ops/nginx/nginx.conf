# ==============================================================================
# ProctorNet Edge Reverse Proxy Configuration (Appendix E / P9 Task 4)
# Production-Hardened Nginx Configuration
# ==============================================================================

user nginx;
worker_processes auto;
worker_rlimit_nofile 65535;
pid /var/run/nginx.pid;

events {
    worker_connections 8192;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # --------------------------------------------------------------------------
    # Logging Configuration (Structured JSON Logging)
    # --------------------------------------------------------------------------
    log_format json_analytics escape=json '{'
        '"time_local":"$time_iso8601",'
        '"remote_addr":"$remote_addr",'
        '"remote_user":"$remote_user",'
        '"request":"$request",'
        '"status": "$status",'
        '"body_bytes_sent":"$body_bytes_sent",'
        '"request_time":"$request_time",'
        '"http_referrer":"$http_referer",'
        '"http_user_agent":"$http_user_agent",'
        '"upstream_addr":"$upstream_addr",'
        '"upstream_response_time":"$upstream_response_time",'
        '"upstream_status":"$upstream_status",'
        '"pipe":"$pipe"'
    '}';

    access_log /var/log/nginx/access.log json_analytics;
    error_log /var/log/nginx/error.log warn;

    # --------------------------------------------------------------------------
    # TCP / Network Performance Tuning
    # --------------------------------------------------------------------------
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    keepalive_requests 1000;
    types_hash_max_size 2048;
    server_tokens off;

    # --------------------------------------------------------------------------
    # Compression (Gzip + Precompressed Static Brotli / Gzip)
    # --------------------------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/x-javascript
        application/xml
        application/xml+rss
        image/svg+xml;

    gzip_static on;

    # --------------------------------------------------------------------------
    # Rate Limiting & Connection Shielding (Shared NAT University Friendly)
    # --------------------------------------------------------------------------
    # 10MB memory zone holds ~160,000 IP states. 60 requests/sec per IP with 120 burst
    # ensures students behind campus NAT are not falsely throttled.
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=60r/s;
    limit_conn_zone $binary_remote_addr zone=addr_limit:10m;

    # Include virtual host server blocks
    include /etc/nginx/conf.d/*.conf;
}
