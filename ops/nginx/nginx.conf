# ==============================================================================
# ProctorNet Edge Reverse Proxy — Production-Hardened Nginx
# server_tokens off, NAT-aware rate limits (G-05)
# ==============================================================================

user nginx;
worker_processes auto;
worker_rlimit_nofile 65535;
pid /var/run/nginx.pid;

events {
    worker_connections 8192;
    use epoll;
    multi_accept on;
}

http {
    include      /etc/nginx/mime.types;
    default_type application/octet-stream;

    # --------------------------------------------------------------------------
    # Structured JSON access log
    # --------------------------------------------------------------------------
    log_format json_analytics escape=json '{'
        '"time_local":"$time_iso8601",'
        '"remote_addr":"$remote_addr",'
        '"remote_user":"$remote_user",'
        '"request":"$request",'
        '"status":"$status",'
        '"body_bytes_sent":"$body_bytes_sent",'
        '"request_time":"$request_time",'
        '"http_referrer":"$http_referer",'
        '"http_user_agent":"$http_user_agent",'
        '"upstream_addr":"$upstream_addr",'
        '"upstream_response_time":"$upstream_response_time",'
        '"upstream_status":"$upstream_status",'
        '"pipe":"$pipe"'
    '}';

    access_log /var/log/nginx/access.log json_analytics;
    error_log  /var/log/nginx/error.log warn;

    # --------------------------------------------------------------------------
    # Security hardening
    # --------------------------------------------------------------------------
    server_tokens off;

    # --------------------------------------------------------------------------
    # TCP / Network Performance
    # --------------------------------------------------------------------------
    sendfile           on;
    tcp_nopush         on;
    tcp_nodelay        on;
    keepalive_timeout  65;
    keepalive_requests 1000;
    types_hash_max_size 2048;

    # --------------------------------------------------------------------------
    # Compression (gzip_static picks up pre-compressed .gz / .br from Vite)
    # --------------------------------------------------------------------------
    gzip             on;
    gzip_vary        on;
    gzip_proxied     any;
    gzip_comp_level  6;
    gzip_buffers     16 8k;
    gzip_http_version 1.1;
    gzip_min_length  256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/x-javascript
        application/xml
        application/xml+rss
        image/svg+xml;

    gzip_static on;

    # --------------------------------------------------------------------------
    # Rate Limiting & Connection Shielding — NAT-Aware (G-05)
    # 10 MB zone ~160,000 IP states.
    # 60 r/s with 200 burst: tolerates campus NAT where hundreds share one IP.
    # Connection limit 100/IP protects against slow-loris from a single host.
    # --------------------------------------------------------------------------
    limit_req_zone  $binary_remote_addr zone=api_limit:10m rate=60r/s;
    limit_conn_zone $binary_remote_addr zone=addr_limit:10m;

    # Return 429 (not 503) for rate-limited clients
    limit_req_status  429;
    limit_conn_status 429;

    # Include virtual host server blocks
    include /etc/nginx/conf.d/*.conf;
}
