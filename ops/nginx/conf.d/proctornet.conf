# ==============================================================================
# ProctorNet Virtual Host & Upstream Routing (Appendix E / P9 Task 4)
# Least-Connection Load Balancing, WebSocket Upgrades, & Zero-Trust Boundary
# ==============================================================================

upstream api_servers {
    least_conn;
    server api-1:5000 max_fails=3 fail_timeout=10s;
    server api-2:5000 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

# --- HTTP to HTTPS Redirect (Production Port 80) ---
server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Allow ACME HTTP-01 challenge for Let's Encrypt / Certbot
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Internal health check for Nginx container probe
    location = /health {
        access_log off;
        return 200 "healthy\n";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- HTTPS Primary Server (Port 443) ---
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name _;

    # SSL / TLS Modern Cryptography Configuration
    ssl_certificate /etc/nginx/ssl/live/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/live/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # OCSP Stapling
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 1.1.1.1 8.8.8.8 valid=300s;
    resolver_timeout 5s;

    # --------------------------------------------------------------------------
    # Production Hardened Security Headers & Content-Security-Policy (CSP)
    # --------------------------------------------------------------------------
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(self), microphone=(self), display-capture=(self), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://*.amazonaws.com; media-src 'self' blob:; connect-src 'self' wss: ws: https://*.amazonaws.com; font-src 'self' data:; frame-ancestors 'none'; object-src 'none'; base-uri 'self';" always;

    # SPA Root & Static Assets
    root /usr/share/nginx/html;
    index index.html;

    # --------------------------------------------------------------------------
    # Block Protected Internal Endpoints from Edge Access
    # --------------------------------------------------------------------------
    # Metrics must never be exposed publicly over the internet
    location = /metrics {
        deny all;
        return 403;
    }

    # Internal webhooks must be routed through VPN or authenticated endpoints
    location ^~ /internal/ {
        deny all;
        return 403;
    }

    # --------------------------------------------------------------------------
    # API Upstream Routing (/api)
    # --------------------------------------------------------------------------
    location /api/ {
        # Restrict payload size on API tier (evidence uploads use direct S3 presigned POST)
        client_max_body_size 1m;

        # Coarse burst-tolerant outer shield
        limit_req zone=api_limit burst=100 nodelay;
        limit_conn addr_limit 50;

        proxy_pass http://api_servers;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        proxy_buffering on;
        proxy_buffers 8 16k;
        proxy_buffer_size 16k;
    }

    # --------------------------------------------------------------------------
    # WebSocket Upstream Routing (/socket.io/)
    # --------------------------------------------------------------------------
    location /socket.io/ {
        proxy_pass http://api_servers;
        proxy_http_version 1.1;

        # HTTP/1.1 Upgrade headers for WebSocket connection handshakes
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Long-lived persistent WebSocket read/send timeouts (1 hour)
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    # --------------------------------------------------------------------------
    # Static SPA Asset Serving & Caching
    # --------------------------------------------------------------------------
    # Content-hashed Vite assets: 1-year immutable browser and edge caching
    location ~* ^/assets/.*\.(?:css|js|woff2?|svg|png|jpe?g|webp|ico|avif)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
        try_files $uri =404;
    }

    # Single Page Application HTML entrypoint: never cache aggressively
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Edge Liveness Probe
    location = /health {
        access_log off;
        return 200 "healthy\n";
    }
}
