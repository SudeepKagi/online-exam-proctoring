# ==============================================================================
# ProctorNet Virtual Host & Upstream Routing
# NAT-aware rate limits (G-05), /media/ SFU proxy (F-01),
# tightened CSP (D-09), X-Powered-By suppressed, /internal/* denied.
# ==============================================================================

upstream api_servers {
    least_conn;
    server api-1:5000 max_fails=3 fail_timeout=10s;
    server api-2:5000 max_fails=3 fail_timeout=10s;
    server api-3:5000 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

upstream frontend_srv {
    server frontend:8080;
    keepalive 8;
}

upstream livekit_sfu {
    server livekit:7880;
    keepalive 32;
}

# --- HTTP to HTTPS Redirect ---
server {
    listen 80;
    listen [::]:80;
    server_name _;

    # ACME HTTP-01 challenge for Let'"'"'s Encrypt
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Internal nginx liveness probe (bypasses redirect)
    location = /health {
        access_log off;
        return 200 "healthy\n";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- HTTPS Primary Server ---
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name _;

    # TLS Modern Configuration
    ssl_certificate     /etc/nginx/ssl/live/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/live/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_tickets off;

    # OCSP Stapling
    ssl_stapling        on;
    ssl_stapling_verify on;
    resolver 1.1.1.1 8.8.8.8 valid=300s;
    resolver_timeout 5s;

    # --------------------------------------------------------------------------
    # Security Headers (D-09 tightened CSP)
    # --------------------------------------------------------------------------
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff"                                        always;
    add_header X-Frame-Options "DENY"                                           always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin"                always;
    add_header Permissions-Policy        "camera=(self), microphone=(self), display-capture=(self), geolocation=()" always;

    # Tightened CSP (D-09):
    #   - no eval directive (script execution only from 'self')
    #   - script-src locked to 'self' only (no CDN bleed)
    #   - connect-src restricted to self + wss (no wildcard https://)
    #   - worker-src 'self' blob: for face-api web workers
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self' wss: ws:; font-src 'self' data:; worker-src 'self' blob:; frame-ancestors 'none'; object-src 'none'; base-uri 'self';" always;

    # Strip upstream implementation hints
    proxy_hide_header X-Powered-By;
    proxy_hide_header Server;

    # --------------------------------------------------------------------------
    # Block protected internal endpoints from edge access
    # --------------------------------------------------------------------------
    location = /metrics {
        deny all;
        return 403;
    }

    location ^~ /internal/ {
        deny all;
        return 403;
    }

    # --------------------------------------------------------------------------
    # API Upstream Routing (/api)  �  NAT-aware limits (G-05)
    # University campus NAT: many students share one IP.
    # 60 r/s per IP + 200 burst tolerates a lecture hall behind CGNAT.
    # --------------------------------------------------------------------------
    location /api/ {
        client_max_body_size 1m;

        # NAT-aware: generous burst, tight sustained rate
        limit_req  zone=api_limit burst=200 nodelay;
        limit_conn addr_limit 100;

        proxy_pass         http://api_servers;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        proxy_connect_timeout 5s;
        proxy_read_timeout    60s;
        proxy_send_timeout    60s;
        proxy_buffering       on;
        proxy_buffers         8 16k;
        proxy_buffer_size     16k;
    }

    # --------------------------------------------------------------------------
    # WebSocket Routing (/socket.io/)
    # --------------------------------------------------------------------------
    location /socket.io/ {
        proxy_pass         http://api_servers;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering    off;
    }

    # --------------------------------------------------------------------------
    # LiveKit SFU Media Signaling � neutral path (F-01)
    # Path /media/ does not name the SFU product.
    # --------------------------------------------------------------------------
    location /media/ {
        proxy_pass         http://livekit_sfu/;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering    off;
    }

    # --------------------------------------------------------------------------
    # Static SPA � proxy to frontend container (serves pre-compressed assets)
    # --------------------------------------------------------------------------
    # Content-hashed Vite assets: 1-year immutable cache
    location ~* ^/assets/.*\.(?:css|js|woff2?|svg|png|jpe?g|webp|ico|avif)$ {
        proxy_pass         http://frontend_srv;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   Connection "";

        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # SPA HTML entrypoint � never cache
    location / {
        proxy_pass         http://frontend_srv;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Edge liveness probe
    location = /health {
        access_log off;
        return 200 "healthy\n";
    }
}



# SPA history fallback: try_files $uri $uri/ /index.html;
