# ==============================================================================
# ProctorNet Host Kernel & OS Performance Tuning (P9 Task 5)
# Target: High-Concurrency Examination Bursts, SFU Media, & Low-Latency Postgres
# Location: /etc/sysctl.d/99-proctornet.conf
# Apply with: sudo sysctl --system
# ==============================================================================

# ------------------------------------------------------------------------------
# Network Connection Handling & Socket Queues
# ------------------------------------------------------------------------------
# Maximum listen queue backlog for high TCP handshakes during burst logins
net.core.somaxconn = 4096

# Maximum number of remembered connection requests without SYN-ACK acknowledgement
net.ipv4.tcp_max_syn_backlog = 4096

# Expand ephemeral port range for massive concurrent egress (API -> SFU / DB / S3)
net.ipv4.ip_local_port_range = 10240 65535

# Allow reusing TIME_WAIT sockets for new connections safely on Linux NAT boundaries
net.ipv4.tcp_tw_reuse = 1

# Reduce FIN timeout to release closed sockets faster
net.ipv4.tcp_fin_timeout = 15

# Enable TCP BBR congestion control with fair queueing
net.core.default_qdisc = fq
net.ipv4.tcp_congestion_control = bbr

# ------------------------------------------------------------------------------
# UDP Buffer Sizing for LiveKit SFU & WireGuard Video Media
# ------------------------------------------------------------------------------
# Default and maximum OS socket receive/send buffer sizes for high-bitrate video
net.core.rmem_max = 16777216
net.core.wmem_max = 16777216
net.core.rmem_default = 1048576
net.core.wmem_default = 1048576

# ------------------------------------------------------------------------------
# File System & File Descriptor Limits
# ------------------------------------------------------------------------------
# Maximum system-wide open file descriptors (supports millions of socket connections)
fs.file-max = 1000000

# Inotify watches for file watchers and container runtimes
fs.inotify.max_user_watches = 524288
fs.inotify.max_user_instances = 1024

# ------------------------------------------------------------------------------
# Memory & Virtual Memory Management (PostgreSQL & Redis Optimized)
# ------------------------------------------------------------------------------
# Keep swappiness low so database caches remain pinned in physical RAM
vm.swappiness = 10

# Overcommit mode: allow standard Linux virtual memory allocations
vm.overcommit_memory = 1

# Set dirty ratio to flush pages steadily to NVMe without freezing I/O queues
vm.dirty_background_ratio = 5
vm.dirty_ratio = 10

# Transparent Hugepages (THP) for PostgreSQL:
# Postgres operates best when THP is set to 'madvise' rather than 'always'.
# (Configured via systemd/kernel boot flag: echo madvise > /sys/kernel/mm/transparent_hugepage/enabled)
