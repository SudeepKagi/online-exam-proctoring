# ==============================================================================
# ProctorNet Production PostgreSQL Configuration (Single-Node Tuned)
# Target Hardware: 8 vCPU / 16 GB RAM / NVMe SSD
# ==============================================================================

# ------------------------------------------------------------------------------
# Connections & Authentication
# ------------------------------------------------------------------------------
listen_addresses = '*'
port = 5432
max_connections = 100
# Rule (Appendix C): Total client pool sizes <= 60% of max_connections (60 active)

# ------------------------------------------------------------------------------
# Memory & Caching
# ------------------------------------------------------------------------------
shared_buffers = 4GB                     # 25% of total system RAM
effective_cache_size = 12GB               # 75% of total system RAM
work_mem = 32MB                           # Per-operation sort/hash memory
maintenance_work_mem = 1GB                # For VACUUM, CREATE INDEX, ALTER TABLE
wal_buffers = 16MB

# ------------------------------------------------------------------------------
# Disk & Query Planner Cost Constants (NVMe Optimized)
# ------------------------------------------------------------------------------
random_page_cost = 1.1                   # Fast NVMe random read latency
seq_page_cost = 1.0
effective_io_concurrency = 200           # High NVMe queue depth
default_statistics_target = 100

# ------------------------------------------------------------------------------
# WAL & Checkpoints
# ------------------------------------------------------------------------------
checkpoint_timeout = 15min
checkpoint_completion_target = 0.9       # Spread writes over 90% of checkpoint window
max_wal_size = 8GB
min_wal_size = 1GB

# ------------------------------------------------------------------------------
# Monitoring, Telemetry & Diagnostics (Mandatory P3 Observability)
# ------------------------------------------------------------------------------
shared_preload_libraries = 'pg_stat_statements,auto_explain'

# pg_stat_statements tracking
pg_stat_statements.max = 10000
pg_stat_statements.track = all
pg_stat_statements.track_utility = off

# auto_explain tracking slow queries with buffer statistics
auto_explain.log_min_duration = 200ms
auto_explain.log_analyze = true
auto_explain.log_buffers = true
auto_explain.log_timing = true
auto_explain.log_format = text

# Logging slow statements and lock contention
log_min_duration_statement = 200ms
log_lock_waits = on
deadlock_timeout = 1s

# ------------------------------------------------------------------------------
# Aggressive Autovacuum for High-Concurrency Examination Bursts
# ------------------------------------------------------------------------------
autovacuum = on
autovacuum_max_workers = 4
autovacuum_naptime = 10s
autovacuum_vacuum_threshold = 50
autovacuum_analyze_threshold = 50
autovacuum_vacuum_scale_factor = 0.05
autovacuum_analyze_scale_factor = 0.02
autovacuum_vacuum_cost_limit = 2000
autovacuum_vacuum_cost_delay = 2ms

# ------------------------------------------------------------------------------
# Client Session Guardrails
# ------------------------------------------------------------------------------
statement_timeout = 30s
lock_timeout = 5s
idle_in_transaction_session_timeout = 15s
