<svg xmlns="http://www.w3.org/2000/svg" width="900" height="320" viewBox="0 0 900 320" style="background:#0f172a; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px;">
  <!-- Title -->
  <text x="20" y="28" fill="#f8fafc" font-size="15" font-weight="bold">Flamegraph: POST /api/student/exams/:id/start (Baseline Profile - 50 VUs)</text>
  <text x="20" y="48" fill="#94a3b8" font-size="11">Total Duration: ~7,842 ms (p95: 9,920 ms) | Limiting Resource: Prisma Interactive $transaction Timeout</text>

  <!-- Level 0: Total Request Handling -->
  <rect x="20" y="70" width="860" height="34" rx="3" fill="#be123c" opacity="0.9" />
  <text x="30" y="92" fill="#ffffff" font-weight="bold">Express Middleware + Controller: startExam [7,842 ms]</text>

  <!-- Level 1: Sub-components -->
  <rect x="20" y="110" width="100" height="34" rx="3" fill="#ea580c" opacity="0.9" />
  <text x="26" y="132" fill="#ffffff">Auth JWT (15ms)</text>

  <rect x="125" y="110" width="380" height="34" rx="3" fill="#dc2626" opacity="0.9" />
  <text x="135" y="132" fill="#ffffff" font-weight="bold">Prisma Pool Queue: Pool Wait [4,200 ms]</text>

  <rect x="510" y="110" width="220" height="34" rx="3" fill="#b91c1c" opacity="0.9" />
  <text x="518" y="132" fill="#ffffff">Interactive $transaction (2,450 ms)</text>

  <rect x="735" y="110" width="145" height="34" rx="3" fill="#d97706" opacity="0.9" />
  <text x="742" y="132" fill="#ffffff">Load 50 Qs + Leak Key (1,177 ms)</text>

  <!-- Level 2: Inside Transaction and Question Load -->
  <rect x="510" y="150" width="110" height="34" rx="3" fill="#991b1b" opacity="0.9" />
  <text x="516" y="172" fill="#ffffff">Verify Window (820ms)</text>

  <rect x="625" y="150" width="105" height="34" rx="3" fill="#991b1b" opacity="0.9" />
  <text x="630" y="172" fill="#ffffff">State Machine (1630ms)</text>

  <rect x="735" y="150" width="145" height="34" rx="3" fill="#b45309" opacity="0.9" />
  <text x="740" y="172" fill="#ffffff">JSON Parse Options (920ms)</text>

  <!-- Level 3: Network & Lock Details -->
  <rect x="510" y="190" width="370" height="30" rx="3" fill="#78350f" opacity="0.8" />
  <text x="520" y="210" fill="#fef3c7" font-size="11">Prisma P2028: Unable to start transaction in the given time under concurrency</text>

  <!-- Legend -->
  <rect x="20" y="260" width="860" height="42" rx="4" fill="#1e293b" />
  <text x="35" y="285" fill="#f43f5e" font-size="12">Root Failure Mode:</text>
  <text x="175" y="285" fill="#f8fafc" font-size="11">Single global pool (17 conns) exhausted by interactive transactions; candidate burst drops into HTTP 500 cascade</text>
</svg>
