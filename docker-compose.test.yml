# ==============================================================================
# ProctorNet Real-Stack Test Harness (Prompt 2 — Phase Q0)
# Real PostgreSQL 16, Redis 7, RabbitMQ 3.13, MinIO S3, LiveKit SFU, api x2, worker, nginx, built SPA
# Usage:
#   npm run stack:test:up
#   npm run stack:test:down
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # Edge Nginx Reverse Proxy & Static SPA Serving
  # ----------------------------------------------------------------------------
  nginx:
    image: nginx:1.25-alpine
    container_name: proctornet-test-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./ops/nginx/test-nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - test-net
    depends_on:
      api-1:
        condition: service_healthy
      api-2:
        condition: service_healthy
      frontend:
        condition: service_started

  # ----------------------------------------------------------------------------
  # Built SPA Frontend
  # ----------------------------------------------------------------------------
  frontend:
    build:
      context: ./proctornet/frontend
      dockerfile: Dockerfile
    container_name: proctornet-test-frontend
    networks:
      - test-net
    expose:
      - "8080"

  # ----------------------------------------------------------------------------
  # Horizontally Scaled API Pods (api-1, api-2)
  # ----------------------------------------------------------------------------
  api-1:
    build:
      context: ./proctornet/backend
      dockerfile: Dockerfile
    container_name: proctornet-test-api-1
    environment:
      PORT: 5000
      NODE_ENV: test
      START_WORKERS: "false"
      DATABASE_URL: postgresql://postgres:test_password_secure@postgres:5432/proctornet_test?schema=public
      DIRECT_URL: postgresql://postgres:test_password_secure@postgres:5432/proctornet_test?schema=public
      REDIS_URL: redis://redis:6379
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      JWT_SECRET: test_ci_secret_at_least_64_bytes_super_secure_proctornet_2026
      LIVEKIT_URL: http://livekit:7880
      LIVEKIT_API_KEY: devkey
      LIVEKIT_API_SECRET: secretsecretsecretsecretsecretsecret
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: proctornet-evidence
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      AWS_REGION: us-east-1
      VPN_ENABLED: "false"
    networks:
      - test-net
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio-setup:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:5000/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

  api-2:
    build:
      context: ./proctornet/backend
      dockerfile: Dockerfile
    container_name: proctornet-test-api-2
    environment:
      PORT: 5000
      NODE_ENV: test
      START_WORKERS: "false"
      DATABASE_URL: postgresql://postgres:test_password_secure@postgres:5432/proctornet_test?schema=public
      DIRECT_URL: postgresql://postgres:test_password_secure@postgres:5432/proctornet_test?schema=public
      REDIS_URL: redis://redis:6379
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      JWT_SECRET: test_ci_secret_at_least_64_bytes_super_secure_proctornet_2026
      LIVEKIT_URL: http://livekit:7880
      LIVEKIT_API_KEY: devkey
      LIVEKIT_API_SECRET: secretsecretsecretsecretsecretsecret
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: proctornet-evidence
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      AWS_REGION: us-east-1
      VPN_ENABLED: "false"
    networks:
      - test-net
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio-setup:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:5000/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

  # ----------------------------------------------------------------------------
  # Asynchronous Background Worker
  # ----------------------------------------------------------------------------
  worker:
    build:
      context: ./proctornet/backend
      dockerfile: Dockerfile
    container_name: proctornet-test-worker
    command: ["node", "src/worker.js"]
    environment:
      NODE_ENV: test
      START_WORKERS: "true"
      DATABASE_URL: postgresql://postgres:test_password_secure@postgres:5432/proctornet_test?schema=public
      DIRECT_URL: postgresql://postgres:test_password_secure@postgres:5432/proctornet_test?schema=public
      REDIS_URL: redis://redis:6379
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      JWT_SECRET: test_ci_secret_at_least_64_bytes_super_secure_proctornet_2026
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: proctornet-evidence
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      AWS_REGION: us-east-1
      VPN_ENABLED: "false"
    networks:
      - test-net
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  # ----------------------------------------------------------------------------
  # Real Database: PostgreSQL 16
  # ----------------------------------------------------------------------------
  postgres:
    image: postgres:16.4-alpine
    container_name: proctornet-test-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: test_password_secure
      POSTGRES_DB: proctornet_test
    ports:
      - "5433:5432"
    networks:
      - test-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d proctornet_test"]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 5s

  # ----------------------------------------------------------------------------
  # Real Cache & Distributed State: Redis 7
  # ----------------------------------------------------------------------------
  redis:
    image: redis:7.4-alpine
    container_name: proctornet-test-redis
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "6379:6379"
    networks:
      - test-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 2s
      retries: 10
      start_period: 3s

  # ----------------------------------------------------------------------------
  # Real Message Broker: RabbitMQ 3.13
  # ----------------------------------------------------------------------------
  rabbitmq:
    image: rabbitmq:3.13.7-management-alpine
    container_name: proctornet-test-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - test-net
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_running"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # ----------------------------------------------------------------------------
  # Real S3-Compatible Object Store: MinIO
  # ----------------------------------------------------------------------------
  minio:
    image: minio/minio:RELEASE.2024-01-18T22-51-28Z
    container_name: proctornet-test-minio
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    networks:
      - test-net
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:9000/minio/health/live || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 5s

  # Helper to create required buckets
  minio-setup:
    image: minio/mc:RELEASE.2024-01-16T16-06-34Z
    container_name: proctornet-test-minio-setup
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - test-net
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set local http://minio:9000 minioadmin minioadmin;
      /usr/bin/mc mb --ignore-existing local/proctornet-evidence;
      /usr/bin/mc mb --ignore-existing local/proctornet-questions;
      /usr/bin/mc anonymous set download local/proctornet-questions;
      exit 0;
      "

  # ----------------------------------------------------------------------------
  # Real Media SFU: LiveKit Server
  # ----------------------------------------------------------------------------
  livekit:
    image: livekit/livekit-server:v1.13.7
    container_name: proctornet-test-livekit
    command: --config /etc/livekit.yaml
    environment:
      LIVEKIT_API_KEY: devkey
      LIVEKIT_API_SECRET: secretsecretsecretsecretsecretsecret
    volumes:
      - ./ops/livekit/livekit.yaml:/etc/livekit.yaml:ro
    ports:
      - "7880:7880"
      - "7881:7881"
      - "7882:7882/udp"
    networks:
      - test-net

networks:
  test-net:
    driver: bridge
