name: Deploy to AWS (Production Release)

on:
  workflow_run:
    workflows: ["ProctorNet CI/CD Pipeline"]
    branches: [main]
    types: [completed]
  workflow_dispatch:
    inputs:
      override_reason:
        description: 'Reason to bypass exam-aware active attempts gate (if any)'
        required: false
        default: ''

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  deploy:
    name: Verify Artifact & Deploy via SSM
    # Enforce workflow_dispatch only on main branch, and workflow_run only on success
    if: ${{ (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      actions: read
    environment:
      name: production
      url: https://proctornet.duckdns.org

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Verify Workflow Dispatch CI Gate Pass
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          HEAD_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Verifying that CI passed for ${HEAD_SHA} on main..."
          CONCLUSION=$(gh api "repos/${{ github.repository }}/actions/runs" \
            --jq ".workflow_runs[] | select(.head_sha == \"${HEAD_SHA}\" and .name == \"ProctorNet CI/CD Pipeline\") | .conclusion" | head -n 1)
          if [ "$CONCLUSION" != "success" ]; then
            echo "[x] Refusing deployment: CI has not succeeded on main for ${HEAD_SHA} (status: ${CONCLUSION:-not_found})"
            exit 1
          fi
          echo "[✓] CI verification confirmed: CI is green for ${HEAD_SHA}."

      - name: Set up Node.js 22 LTS
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5a1 # v4.1.0
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            proctornet/package-lock.json

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@e3ddf14a3dc1a892e6cc96f3c8377311abbaac43 # v4.0.2
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ secrets.AWS_REGION || 'ap-south-1' }}

      # ── Build Once: Download Pre-Built Release Artifact from CI ──
      - name: Download Pre-Built Release Artifact from CI
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RELEASE_TAG="release-${HEAD_SHA}"
          TAR_FILE="${RELEASE_TAG}.tar.gz"

          if [ -n "${RUN_ID}" ]; then
            echo "Downloading release artifact from CI workflow run ${RUN_ID}..."
            gh run download "${RUN_ID}" -n "${RELEASE_TAG}" || true
          fi

          # If not found via gh run download, build once locally as fallback
          if [ ! -f "${TAR_FILE}" ]; then
            echo "CI artifact not found in workflow run context, generating authoritative bundle..."
            cd proctornet
            npm ci
            cd frontend && npm run build
            cd ..
            npm ci --omit=dev
            cd backend && npx prisma generate
            cd ../..

            cat <<EOF > VERSION
            {
              "version": "${RELEASE_TAG}",
              "gitSha": "${HEAD_SHA}",
              "builtAt": "$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            }
            EOF

            tar -czf "${TAR_FILE}" \
              proctornet/backend \
              proctornet/node_modules \
              proctornet/frontend/dist \
              shared \
              ops/caddy/Caddyfile \
              scripts \
              VERSION

            sha256sum "${TAR_FILE}" > "${TAR_FILE}.sha256"
          fi

          echo "Verifying SHA-256 checksum for release tarball..."
          if [ -f "${TAR_FILE}.sha256" ]; then
            sha256sum -c "${TAR_FILE}.sha256"
          fi
          echo "[✓] Release tarball verified."

          echo "Uploading release tarball and deploy script to S3..."
          BUCKET="${{ secrets.AWS_S3_BUCKET || 'proctornet-storage-prod-858109978489' }}"
          aws s3 cp "${TAR_FILE}" "s3://${BUCKET}/releases/${TAR_FILE}"
          aws s3 cp ops/aws/scripts/deploy-release.sh "s3://${BUCKET}/releases/deploy-release.sh"
          echo "[✓] Release artifacts uploaded to S3."

      - name: Execute Deployment via AWS SSM Session Manager
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          INSTANCE_ID: ${{ secrets.AWS_EC2_INSTANCE_ID }}
          BUCKET: ${{ secrets.AWS_S3_BUCKET || 'proctornet-storage-prod-858109978489' }}
          OVERRIDE_REASON: ${{ github.event.inputs.override_reason || '' }}
        run: |
          RELEASE_TAG="release-${HEAD_SHA}"
          TAR_FILE="${RELEASE_TAG}.tar.gz"

          # Strict regex validation on override reason to prevent command injection (§1 DEP-2 / C5.4)
          if [ -n "${OVERRIDE_REASON}" ]; then
            if ! [[ "${OVERRIDE_REASON}" =~ ^[A-Za-z0-9\ ._:,-]{1,120}$ ]]; then
              echo "[x] Error: Invalid override reason. Must match ^[A-Za-z0-9 ._:,-]{1,120}$"
              exit 1
            fi
          fi

          echo "Encoding SSM payload safely via jq without string interpolation (Appendix C)..."
          payload=$(jq -n --arg tar "$TAR_FILE" --arg bucket "$BUCKET" --arg sha "$HEAD_SHA" --arg ovr "$OVERRIDE_REASON" \
            '{commands: ["aws s3 cp s3://\($bucket)/releases/deploy-release.sh /tmp/deploy-release.sh",
                         "chmod 0700 /tmp/deploy-release.sh",
                         (if ($ovr | length > 0) then
                            "/tmp/deploy-release.sh \($tar) \($bucket) --expected-sha \($sha) --override-b64 \($ovr|@base64)"
                          else
                            "/tmp/deploy-release.sh \($tar) \($bucket) --expected-sha \($sha)"
                          end)]}')

          echo "Triggering SSM send-command on instance: ${INSTANCE_ID}..."
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${INSTANCE_ID}" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploying ${RELEASE_TAG} (exam-aware gate & rollback enabled)" \
            --parameters "${payload}" \
            --output text \
            --query "Command.CommandId")

          echo "SSM Command dispatched with ID: ${COMMAND_ID}"
          echo "Polling execution status..."

          for i in {1..35}; do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "${COMMAND_ID}" \
              --instance-id "${INSTANCE_ID}" \
              --query "Status" \
              --output text 2>/dev/null || echo "Pending")

            echo "Poll attempt ${i}/35: Status=${STATUS}"

            if [ "${STATUS}" = "Success" ]; then
              echo "=========================================================="
              echo "[✓] Deployment completed successfully on instance!"
              echo "=========================================================="
              aws ssm get-command-invocation \
                --command-id "${COMMAND_ID}" \
                --instance-id "${INSTANCE_ID}" \
                --query "StandardOutputContent" \
                --output text
              break
            elif [ "${STATUS}" = "Failed" ] || [ "${STATUS}" = "Cancelled" ] || [ "${STATUS}" = "TimedOut" ]; then
              echo "=========================================================="
              echo "[x] Deployment failed or automatically rolled back!"
              echo "=========================================================="
              aws ssm get-command-invocation \
                --command-id "${COMMAND_ID}" \
                --instance-id "${INSTANCE_ID}" \
                --query "StandardErrorContent" \
                --output text || true
              exit 1
            fi

            sleep 5
          done

      - name: Post-Deploy Automated Smoke & Health Verification
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          INSTANCE_ID: ${{ secrets.AWS_EC2_INSTANCE_ID }}
          BASE_URL: https://proctornet.duckdns.org
          EXPECTED_GIT_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          SMOKE_ADMIN_EMAIL: ${{ secrets.SMOKE_ADMIN_EMAIL }}
          SMOKE_ADMIN_PASSWORD: ${{ secrets.SMOKE_ADMIN_PASSWORD }}
        run: |
          echo "Executing post-deploy read-only production smoke verification..."
          node scripts/ops/production-smoke.js

          echo "Executing post-deploy outbox health and invariant verification via SSM..."
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${INSTANCE_ID}" \
            --document-name "AWS-RunShellScript" \
            --comment "Post-deploy outbox health and attempt invariants check" \
            --parameters '{"commands": ["cd /opt/proctornet/current && node scripts/ops/outbox-health.js"]}' \
            --output text \
            --query "Command.CommandId")

          echo "Polling SSM outbox-health execution status (Command ID: ${COMMAND_ID})..."
          for i in {1..20}; do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "${COMMAND_ID}" \
              --instance-id "${INSTANCE_ID}" \
              --query "Status" \
              --output text 2>/dev/null || echo "Pending")

            echo "Poll attempt ${i}/20: Status=${STATUS}"

            if [ "${STATUS}" = "Success" ]; then
              echo "[✓] Post-deploy outbox health check PASSED on production instance!"
              aws ssm get-command-invocation \
                --command-id "${COMMAND_ID}" \
                --instance-id "${INSTANCE_ID}" \
                --query "StandardOutputContent" \
                --output text
              break
            elif [ "${STATUS}" = "Failed" ] || [ "${STATUS}" = "Cancelled" ] || [ "${STATUS}" = "TimedOut" ]; then
              echo "[x] Post-deploy outbox health check FAILED on production instance!"
              aws ssm get-command-invocation \
                --command-id "${COMMAND_ID}" \
                --instance-id "${INSTANCE_ID}" \
                --query "StandardErrorContent" \
                --output text || true
              exit 1
            fi
            sleep 3
          done
