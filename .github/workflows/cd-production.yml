name: CD — Deploy to Production (Manual Approval)

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag or identifier (leave empty to use commit SHA)'
        required: false
        default: ''

permissions:
  contents: read
  packages: write
  id-token: write

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  build-and-push:
    name: Build & Publish Production Container Images
    if: vars.PROD_CD_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4.2.2

      - name: Resolve Production Image Tag
        id: meta
        run: |
          TAG="${{ github.event.inputs.release_tag }}"
          if [ -z "$TAG" ]; then
            TAG="${{ github.sha }}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3.8.0

      - name: Build and Push Backend Image
        uses: docker/build-push-action@v6.13.0
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/backend:${{ steps.meta.outputs.tag }}
            ghcr.io/${{ github.repository }}/backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and Push Frontend Image
        uses: docker/build-push-action@v6.13.0
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/frontend:${{ steps.meta.outputs.tag }}
            ghcr.io/${{ github.repository }}/frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-production:
    name: Deploy to Production Environment (Protected)
    if: vars.PROD_CD_ENABLED == 'true'
    needs: [ build-and-push ]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: production
      url: https://proctornet.duckdns.org
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4.2.2

      - name: Configure AWS Credentials (OIDC Role Assumption)
        uses: aws-actions/configure-aws-credentials@v4
        continue-on-error: true
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          audience: sts.amazonaws.com
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || 'ap-south-1' }}

      - name: Execute Production Deployment with Automatic Rollback
        env:
          INSTANCE_ID: ${{ secrets.AWS_EC2_INSTANCE_ID }}
          IMAGE_TAG: ${{ needs.build-and-push.outputs.image_tag }}
          GHCR_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_ACTOR: ${{ github.actor }}
        run: |
          if [ -z "${INSTANCE_ID}" ]; then
            echo "[!] No production EC2 instance ID configured. Skipping remote host execution."
            echo "Production container images successfully published to GHCR with tag: ${IMAGE_TAG}"
            exit 0
          fi

          DEPLOY_SCRIPT=$(cat << 'EOF'
          set -euo pipefail
          PROD_DIR="/opt/proctornet"
          mkdir -p "$PROD_DIR"
          cd "$PROD_DIR"

          # 1. Capture currently active tag for rollback safety
          PREV_TAG=""
          if [ -f "$PROD_DIR/ACTIVE_TAG" ]; then
            PREV_TAG=$(cat "$PROD_DIR/ACTIVE_TAG")
          fi
          echo "Previous active production tag: ${PREV_TAG:-none}"
          echo "Target deployment tag: $IMAGE_TAG"

          # 2. Authenticate Docker with GHCR
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GH_ACTOR" --password-stdin

          # 3. Pull new images
          echo "Pulling production images..."
          docker pull "ghcr.io/$GHCR_REPO/backend:$IMAGE_TAG"
          docker pull "ghcr.io/$GHCR_REPO/frontend:$IMAGE_TAG"

          # 3.5. Run preflight environment check on live .env
          echo "Running preflight environment validation..."
          docker run --rm \
            -v "$PROD_DIR/shared/.env:/app/.env:ro" \
            "ghcr.io/$GHCR_REPO/backend:$IMAGE_TAG" \
            node scripts/ops/preflight-env.js /app/.env --prod

          # 4. Run database migrations BEFORE starting the new backend version
          echo "Executing Prisma migrate deploy..."
          docker run --rm \
            --network host \
            --env-file "$PROD_DIR/shared/.env" \
            "ghcr.io/$GHCR_REPO/backend:$IMAGE_TAG" \
            npx prisma migrate deploy

          # 5. Launch containers
          export IMAGE_TAG
          docker compose up -d --remove-orphans

          # 6. Verify healthcheck with automatic rollback on failure
          HEALTHY=false
          echo "Probing production backend container health..."
          for i in {1..30}; do
            STATUS=$(docker inspect --format '{{.State.Health.Status}}' proctornet-backend 2>/dev/null || true)
            if [ "$STATUS" = "healthy" ]; then
              echo "[✓] Production backend container is healthy"
              HEALTHY=true
              echo "$IMAGE_TAG" > "$PROD_DIR/ACTIVE_TAG"
              break
            fi
            sleep 3
          done

          if [ "$HEALTHY" = "true" ]; then
            echo "Running smoke tests against production edge..."
            node scripts/ops/smoke-staging.js --origin "https://${PUBLIC_HOST:-proctornet.duckdns.org}" || {
              echo "[!] Smoke test failed against production origin!"
              HEALTHY=false
            }
          fi

          if [ "$HEALTHY" != "true" ]; then
            echo "[!] Healthcheck failed! Initiating automatic rollback..."
            if [ -n "$PREV_TAG" ]; then
              echo "Rolling back to previous tag: $PREV_TAG"
              export IMAGE_TAG="$PREV_TAG"
              docker compose up -d --remove-orphans
              echo "[✓] Rolled back production to tag: $PREV_TAG"
            fi
            exit 1
          fi

          # Prune obsolete images
          docker image prune -af --filter "until=72h" || true
          EOF
          )

          ENCODED_SCRIPT=$(printf "%s" "$DEPLOY_SCRIPT" | base64 -w 0)
          PAYLOAD=$(jq -n \
            --arg tag "$IMAGE_TAG" \
            --arg repo "$GHCR_REPO" \
            --arg token "$GH_TOKEN" \
            --arg actor "$GH_ACTOR" \
            --arg b64 "$ENCODED_SCRIPT" \
            '{commands: [
              ("export IMAGE_TAG=" + ($tag | @sh)),
              ("export GHCR_REPO=" + ($repo | @sh)),
              ("export GH_TOKEN=" + ($token | @sh)),
              ("export GH_ACTOR=" + ($actor | @sh)),
              ("echo " + ($b64 | @sh) + " | base64 -d | bash")
            ]}')

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${INSTANCE_ID}" \
            --document-name "AWS-RunShellScript" \
            --comment "ProctorNet Production Deployment: ${IMAGE_TAG}" \
            --parameters "${PAYLOAD}" \
            --output text \
            --query "Command.CommandId")

          echo "SSM Command dispatched: ${COMMAND_ID}"
          for i in {1..30}; do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "${COMMAND_ID}" \
              --instance-id "${INSTANCE_ID}" \
              --query "Status" \
              --output text 2>/dev/null || echo "Pending")
            if [ "${STATUS}" = "Success" ]; then
              echo "[✓] Production deployment completed successfully!"
              break
            elif [ "${STATUS}" = "Failed" ] || [ "${STATUS}" = "Cancelled" ] || [ "${STATUS}" = "TimedOut" ]; then
              echo "[x] Production deployment failed!"
              exit 1
            fi
            sleep 4
          done
