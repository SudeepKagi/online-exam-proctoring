name: ProctorNet CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

env:
  REGISTRY: ghcr.io

jobs:
  # ----------------------------------------------------------------------------
  # Stage 1: Code Quality, Linting & Architecture Integrity Gates
  # ----------------------------------------------------------------------------
  quality:
    name: Lint & Architecture Gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            proctornet/package-lock.json

      - name: Install Dependencies
        run: |
          npm ci
          cd proctornet && npm ci

      - name: Backend Lint
        working-directory: proctornet/backend
        run: npm run lint

      - name: Frontend Lint
        working-directory: proctornet/frontend
        run: npm run lint

      - name: Check No Stubs (check-no-stubs.js)
        run: node scripts/ci/check-no-stubs.js

      - name: Check No Legacy Code (check-no-legacy.js)
        run: node scripts/ci/check-no-legacy.js

      - name: Check Doc Links Integrity (check-doc-links.js)
        run: node scripts/ci/check-doc-links.js

      - name: Scan Banned Vocabulary (scan-banned-terms.js)
        run: node scripts/ci/scan-banned-terms.js

      - name: Check No Source-Grep Tests (check-no-source-grep-tests.js)
        run: node scripts/ci/check-no-source-grep-tests.js

      - name: Route Inventory Drift Check (generate-route-inventory.js --check)
        env:
          NODE_PATH: ${{ github.workspace }}/proctornet/backend/node_modules:${{ github.workspace }}/proctornet/node_modules
          DATABASE_URL: postgresql://postgres:password@localhost:5432/dummy?schema=public
          JWT_SECRET: dummy_secret_for_route_inventory_introspection_32_bytes
        run: node scripts/ci/generate-route-inventory.js --check

      - name: Check Claims Ledger Integrity (check-ledger.js)
        run: node scripts/ci/check-ledger.js

      - name: Check E2E Test Suite Integrity (check-e2e-integrity.js)
        run: node scripts/ci/check-e2e-integrity.js

  # ----------------------------------------------------------------------------
  # Stage 2: Database Migration Integrity & Clean Replay
  # ----------------------------------------------------------------------------
  migrations:
    name: Database Migration & Schema Alignment
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: proctornet_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: proctornet/package-lock.json

      - name: Install Backend Dependencies
        working-directory: proctornet
        run: npm ci

      - name: Apply Migrations from Baseline
        working-directory: proctornet/backend
        env:
          DATABASE_URL: postgresql://postgres:password@localhost:5432/proctornet_ci?schema=public
          DIRECT_URL: postgresql://postgres:password@localhost:5432/proctornet_ci?schema=public
        run: npx prisma migrate deploy

      - name: Verify Strict Migration Diff (Zero Schema Drift)
        working-directory: proctornet/backend
        env:
          DATABASE_URL: postgresql://postgres:password@localhost:5432/proctornet_ci?schema=public
          DIRECT_URL: postgresql://postgres:password@localhost:5432/proctornet_ci?schema=public
        run: |
          npx prisma migrate diff \
            --from-schema-datasource prisma/schema.prisma \
            --to-schema-datamodel prisma/schema.prisma \
            --exit-code

  # ----------------------------------------------------------------------------
  # Stage 3: Full Automated Test Suites (Unit, Integration, Security, Resilience)
  # ----------------------------------------------------------------------------
  test:
    name: Full Test Suite Execution
    needs: [quality, migrations]
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: proctornet_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      rabbitmq:
        image: rabbitmq:3.12-alpine
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics check_running"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            proctornet/package-lock.json

      - name: Install Dependencies
        run: |
          npm ci
          cd proctornet && npm ci

      - name: Generate Prisma Client & Migrate
        working-directory: proctornet/backend
        env:
          DATABASE_URL: postgresql://postgres:password@localhost:5432/proctornet_ci?schema=public
          DIRECT_URL: postgresql://postgres:password@localhost:5432/proctornet_ci?schema=public
          ADMIN_EMAIL: admin@proctornet.com
          ADMIN_PASSWORD: Admin@12345
        run: |
          npx prisma generate
          npx prisma migrate deploy
          node prisma/seed/admin.js

      - name: Run Hermetic Autodiscovered Test Suites
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://postgres:password@localhost:5432/proctornet_ci?schema=public
          DIRECT_URL: postgresql://postgres:password@localhost:5432/proctornet_ci?schema=public
          REDIS_URL: redis://localhost:6379
          RABBITMQ_URL: amqp://guest:guest@localhost:5672
          JWT_SECRET: dummy_ci_jwt_secret_must_be_at_least_32_bytes_long_12345
          REFRESH_SECRET: dummy_ci_refresh_secret_at_least_32_bytes_long_12345
          AWS_REGION: ap-south-1
          AWS_ACCESS_KEY_ID: dummy_ci_test_access_key_12345
          AWS_SECRET_ACCESS_KEY: dummy_ci_test_secret_key_12345
          AWS_S3_BUCKET_NAME: proctornet-ci-test-bucket
          S3_BUCKET: proctornet-ci-test-bucket
          S3_MOCK: "true"
          FACE_DRIVER: off
          AGENT_PAIRING_PEPPER: dummy_ci_pepper_test_secret_at_least_32_chars_123
          AGENT_POLICY_SIGNING_KEY: dummy_ci_signing_test_secret_at_least_32_chars_456
          PUBLIC_ORIGIN: http://localhost:5000
          LIVEKIT_API_KEY: devkey
          LIVEKIT_API_SECRET: secretsecretsecretsecretsecretsecret
          VPN_ENABLED: false
        run: node scripts/ci/run-tests.js

  # ----------------------------------------------------------------------------
  # Stage 4: Frontend Production Build & Asset Verification
  # ----------------------------------------------------------------------------
  build-frontend:
    name: Frontend Build & Asset Verification
    needs: [quality]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: proctornet/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: proctornet
        run: npm ci

      - name: Build Frontend SPA
        working-directory: proctornet/frontend
        run: |
          npm run build
          test -d dist && test -f dist/index.html
          echo "[✓] Frontend production bundle verified."

  # ----------------------------------------------------------------------------
  # Stage 5: Security Audits & Vulnerability Scans
  # ----------------------------------------------------------------------------
  security-scan:
    name: Security Audits & Vulnerability Gates
    needs: [test, build-frontend]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Audit Backend Production Dependencies
        working-directory: proctornet/backend
        run: npm audit --omit=dev --audit-level=high

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Container for Scanning
        uses: docker/build-push-action@v5
        with:
          context: ./proctornet/backend
          file: ./proctornet/backend/Dockerfile
          load: true
          tags: proctornet-backend-scan:${{ github.sha }}

      - name: Install Trivy CLI
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin

      - name: Scan Container Image with Trivy
        run: |
          trivy image --format table --exit-code 1 --ignore-unfixed --vuln-type os,library --severity CRITICAL proctornet-backend-scan:${{ github.sha }}

  # ----------------------------------------------------------------------------
  # Stage 6: Release Packaging & Artifact Publishing (Build Once)
  # ----------------------------------------------------------------------------
  package:
    name: Package Release Bundle (Build Once)
    needs: [test, build-frontend, security-scan, e2e-journeys]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            proctornet/package-lock.json

      - name: Build Frontend SPA
        working-directory: proctornet
        run: |
          npm ci
          cd frontend
          npm run build
          test -d dist && test -f dist/index.html

      - name: Package Backend Production Dependencies
        working-directory: proctornet
        run: |
          npm ci --omit=dev
          cd backend
          npx prisma generate

      - name: Create Version Metadata & Archive Bundle
        run: |
          RELEASE_TAG="release-${{ github.sha }}"
          TAR_FILE="${RELEASE_TAG}.tar.gz"

          cat <<EOF > VERSION
          {
            "version": "${RELEASE_TAG}",
            "gitSha": "${{ github.sha }}",
            "builtAt": "$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          }
          EOF

          tar -czf "${TAR_FILE}" \
            proctornet/backend \
            proctornet/node_modules \
            proctornet/frontend/dist \
            shared \
            ops/caddy/Caddyfile \
            scripts \
            VERSION

          sha256sum "${TAR_FILE}" > "${TAR_FILE}.sha256"

      - name: Upload Release Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ github.sha }}
          path: |
            release-${{ github.sha }}.tar.gz
            release-${{ github.sha }}.tar.gz.sha256
          retention-days: 14

  # ----------------------------------------------------------------------------
  # Stage 7: CI Boot Smoke Gate (Prompt 8 / U2.3)
  # ----------------------------------------------------------------------------
  boot-smoke:
    name: Backend Boot Smoke Gate (boot-smoke.js)
    needs: [migrations, test]
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: proctornet_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: |
          npm ci
          cd proctornet && npm ci

      - name: Run Prisma Migrations & Seed Baseline
        working-directory: proctornet/backend
        env:
          DATABASE_URL: postgresql://postgres:password@localhost:5432/proctornet_ci?schema=public
          DIRECT_URL: postgresql://postgres:password@localhost:5432/proctornet_ci?schema=public
          ADMIN_EMAIL: admin@proctornet.com
          ADMIN_PASSWORD: Admin@12345
        run: |
          npx prisma generate
          npx prisma migrate deploy
          node prisma/seed/admin.js

      - name: Execute Boot Smoke Suite
        env:
          DATABASE_URL: postgresql://postgres:password@localhost:5432/proctornet_ci?schema=public
          DIRECT_URL: postgresql://postgres:password@localhost:5432/proctornet_ci?schema=public
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: super_secure_ci_test_jwt_secret_key_32_chars_minimum
          S3_BUCKET: proctornet-ci-bucket
          AWS_REGION: us-east-1
          AWS_ACCESS_KEY_ID: minioadmin
          AWS_SECRET_ACCESS_KEY: minioadmin
          BOOT_SMOKE_PORT: 5099
        run: node scripts/ci/boot-smoke.js

  # ----------------------------------------------------------------------------
  # Stage 8: Layer 1 Deterministic E2E Journeys (Prompt 8 / U4)
  # ----------------------------------------------------------------------------
  e2e-journeys:
    name: Layer 1 Deterministic Human Journeys (Playwright J1–J9)
    needs: [test, build-frontend, boot-smoke]
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: proctornet_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: |
          npm ci
          cd proctornet && npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Run Prisma Migrations & Seed Baseline
        working-directory: proctornet/backend
        env:
          DATABASE_URL: postgresql://postgres:password@localhost:5432/proctornet_ci?schema=public
          DIRECT_URL: postgresql://postgres:password@localhost:5432/proctornet_ci?schema=public
          ADMIN_EMAIL: admin@proctornet.com
          ADMIN_PASSWORD: Admin@123
        run: |
          npx prisma generate
          npx prisma migrate deploy
          node prisma/seed/admin.js

      - name: Run Deterministic Journeys Suite (Prod-Parity xvfb-run)
        env:
          E2E_PROFILE: prod-parity
          DATABASE_URL: postgresql://postgres:password@localhost:5432/proctornet_ci?schema=public
          DIRECT_URL: postgresql://postgres:password@localhost:5432/proctornet_ci?schema=public
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: super_secure_ci_test_jwt_secret_key_32_chars_minimum
          ADMIN_EMAIL: admin@proctornet.com
          ADMIN_PASSWORD: Admin@123
          S3_BUCKET: proctornet-ci-bucket
          AWS_REGION: ap-south-1
          AWS_ACCESS_KEY_ID: dummy_ci_key
          AWS_SECRET_ACCESS_KEY: dummy_ci_secret
          START_WORKERS: "true"
          QUEUE_DRIVER: postgres
          CACHE_DRIVER: memory
          FACE_DRIVER: test
          NODE_ENV: production
          COOKIE_SECURE: "false"
          AGENT_PAIRING_PEPPER: dummy_ci_pepper_test_secret_at_least_32_chars_123
          AGENT_POLICY_SIGNING_KEY: dummy_ci_signing_test_secret_at_least_32_chars_456
          HEADED: 'false'
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "[CI] Running full deterministic journey suite (J1–J13)..."
            xvfb-run --auto-servernum --server-args="-screen 0 1440x900x24" npx playwright test e2e/journeys/ --project=chromium
          else
            echo "[CI] Running PR gate journeys (J1, J3, J4, J6, J10)..."
            xvfb-run --auto-servernum --server-args="-screen 0 1440x900x24" npx playwright test \
              e2e/journeys/j1-onboarding.spec.ts \
              e2e/journeys/j3-student-happy-path.spec.ts \
              e2e/journeys/j4-identity-paths.spec.ts \
              e2e/journeys/j6-security-negative.spec.ts \
              e2e/journeys/j10-lifecycle-results.spec.ts \
              --project=chromium
          fi

      - name: Upload E2E HTML Report, Traces & Evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.sha }}
          path: |
            reports/e2e/
            test-results/
            reports/evidence/
          retention-days: 14

  # ----------------------------------------------------------------------------
  # Stage 9: Layer 2 AI Exploratory Tester (Prompt 8 / U5)
  # ----------------------------------------------------------------------------
  ai-explorer:
    name: Layer 2 AI Exploratory Tester (Advisory UX)
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    needs: [boot-smoke]
    runs-on: ubuntu-latest
    continue-on-error: true # Strictly advisory: Never blocks merge gate
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: |
          npm ci
          cd proctornet && npm ci
          npx playwright install --with-deps chromium

      - name: Run AI Persona Explorer
        env:
          BASE_URL: http://localhost:5173
          AI_E2E_PER_RUN_CAP_USD: '1.50'
          AI_E2E_MONTHLY_CAP_USD: '50.00'
        run: |
          npx playwright test e2e/ai/ --project=chromium || true

      - name: Upload AI Explorer Findings Report
        uses: actions/upload-artifact@v4
        with:
          name: ai-explorer-findings-${{ github.sha }}
          path: reports/ai-tester/
          retention-days: 14

  # ----------------------------------------------------------------------------
  # Stage 10: Master CI Merge Gate (Branch Protection Required Status Check)
  # ----------------------------------------------------------------------------
  ci-gate:
    name: CI Merge Gate (ci-gate)
    needs:
      - quality
      - migrations
      - test
      - build-frontend
      - boot-smoke
      - e2e-journeys
      - security-scan
      - package
    runs-on: ubuntu-latest
    steps:
      - name: Verify All Mandatory Gates
        run: |
          echo "======================================================================"
          echo "✓ CI Gate PASSED for commit: ${{ github.sha }}"
          echo "✓ All mandatory quality, boot, and deterministic journey gates green."
          echo "======================================================================"

