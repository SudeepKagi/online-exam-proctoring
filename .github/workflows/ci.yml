name: CI

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'docs/**'
      - '*.md'
  pull_request:
    branches: [ main ]
    paths-ignore:
      - 'docs/**'
      - '*.md'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ----------------------------------------------------------------------------
  # 1. Verify: Zero-dependency linting, compilation, schema diff, quality.js
  # ----------------------------------------------------------------------------
  verify:
    name: Verify (Lint, Build, Quality)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Workspace
        uses: ./.github/actions/setup

      - name: Run Hermetic Verification Suite
        run: npm run verify

  # ----------------------------------------------------------------------------
  # 2. Integration: PostgreSQL + MinIO (Lite Profile Parity) & Boot Smoke
  # ----------------------------------------------------------------------------
  integration:
    name: Integration & Boot Smoke
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: proctornet_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d proctornet_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

      minio:
        image: minio/minio:latest
        env:
          MINIO_ROOT_USER: minioadmin
          MINIO_ROOT_PASSWORD: minioadmin
        ports:
          - 9000:9000
        options: >-
          server /data --console-address ":9001"
          --health-cmd "curl -f http://localhost:9000/minio/health/live"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Workspace
        uses: ./.github/actions/setup

      - name: Provision MinIO Bucket
        run: |
          docker run --network host --rm minio/mc:latest \
            /bin/sh -c "/usr/bin/mc alias set local http://localhost:9000 minioadmin minioadmin && /usr/bin/mc mb --ignore-existing local/proctornet-storage-test"

      - name: Apply Migrations & Seed Baseline Admin
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/proctornet_ci?schema=public
        run: |
          npx prisma migrate deploy --schema=proctornet/backend/prisma/schema.prisma
          node proctornet/backend/prisma/seed/admin.js

      - name: Backend Integration Tests
        env:
          NODE_ENV: test
          APP_PROFILE: lite
          QUEUE_DRIVER: postgres
          CACHE_DRIVER: memory
          MEDIA_DRIVER: snapshot
          FACE_DRIVER: mock
          START_WORKERS: false
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/proctornet_ci?schema=public
          JWT_SECRET: ci_unified_dummy_jwt_secret_must_be_at_least_32_bytes_long_12345
          S3_ENDPOINT: http://localhost:9000
          S3_BUCKET_NAME: proctornet-storage-test
          S3_FORCE_PATH_STYLE: "true"
          AWS_REGION: us-east-1
          AWS_ACCESS_KEY_ID: minioadmin
          AWS_SECRET_ACCESS_KEY: minioadmin
        run: |
          node scripts/ci/run-tests.js --profile lite

      - name: Boot Smoke Check
        env:
          NODE_ENV: test
          APP_PROFILE: lite
          PORT: 5000
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/proctornet_ci?schema=public
          JWT_SECRET: ci_unified_dummy_jwt_secret_must_be_at_least_32_bytes_long_12345
          S3_ENDPOINT: http://localhost:9000
          S3_BUCKET_NAME: proctornet-storage-test
        run: |
          node scripts/ci/boot-smoke.js

  # ----------------------------------------------------------------------------
  # 3. E2E: Playwright Journeys against Prod-Parity Stack
  # ----------------------------------------------------------------------------
  e2e:
    name: E2E Journeys (Playwright)
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || contains(github.event.pull_request.labels.*.name, 'e2e') || contains(github.event.pull_request.labels.*.name, 'full-ci')
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: proctornet_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d proctornet_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

      minio:
        image: minio/minio:latest
        env:
          MINIO_ROOT_USER: minioadmin
          MINIO_ROOT_PASSWORD: minioadmin
        ports:
          - 9000:9000
        options: >-
          server /data --console-address ":9001"
          --health-cmd "curl -f http://localhost:9000/minio/health/live"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Workspace
        uses: ./.github/actions/setup

      - name: Provision MinIO Bucket
        run: |
          docker run --network host --rm minio/mc:latest \
            /bin/sh -c "/usr/bin/mc alias set local http://localhost:9000 minioadmin minioadmin && /usr/bin/mc mb --ignore-existing local/proctornet-storage-test"

      - name: Apply Migrations
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/proctornet_ci?schema=public
        run: |
          npx prisma migrate deploy --schema=proctornet/backend/prisma/schema.prisma

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E Journeys
        env:
          CI: "true"
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/proctornet_ci?schema=public
          JWT_SECRET: ci_unified_dummy_jwt_secret_must_be_at_least_32_bytes_long_12345
          S3_ENDPOINT: http://localhost:9000
          S3_BUCKET_NAME: proctornet-storage-test
          S3_FORCE_PATH_STYLE: "true"
          AWS_REGION: us-east-1
          AWS_ACCESS_KEY_ID: minioadmin
          AWS_SECRET_ACCESS_KEY: minioadmin
        run: npx playwright test

  # ----------------------------------------------------------------------------
  # 4. CI Gate: Blocking gate for PR merges
  # ----------------------------------------------------------------------------
  ci-gate:
    name: CI Gate
    runs-on: ubuntu-latest
    if: always()
    needs: [verify, integration, e2e]
    steps:
      - name: Evaluate Dependencies
        run: |
          VERIFY_STATUS="${{ needs.verify.result }}"
          INTEGRATION_STATUS="${{ needs.integration.result }}"
          E2E_STATUS="${{ needs.e2e.result }}"

          echo "Verify: $VERIFY_STATUS"
          echo "Integration: $INTEGRATION_STATUS"
          echo "E2E: $E2E_STATUS"

          if [ "$VERIFY_STATUS" != "success" ]; then
            echo "::error::Job 'verify' failed (status: $VERIFY_STATUS)"
            exit 1
          fi

          if [ "$INTEGRATION_STATUS" != "success" ]; then
            echo "::error::Job 'integration' failed (status: $INTEGRATION_STATUS)"
            exit 1
          fi

          if [ "$E2E_STATUS" != "success" ] && [ "$E2E_STATUS" != "skipped" ]; then
            echo "::error::Job 'e2e' failed or was cancelled (status: $E2E_STATUS)"
            exit 1
          fi

          echo "✨ All required CI jobs passed cleanly!"
