name: ProctorNet CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

env:
  REGISTRY: ghcr.io

jobs:
  # ----------------------------------------------------------------------------
  # Stage 1: Code Quality, Linting & Architecture Integrity Gates
  # ----------------------------------------------------------------------------
  quality:
    name: Lint & Architecture Gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            proctornet/package-lock.json

      - name: Install Dependencies
        run: |
          npm ci
          cd proctornet && npm ci

      - name: Backend Lint
        working-directory: proctornet/backend
        run: npm run lint

      - name: Frontend Lint
        working-directory: proctornet/frontend
        run: npm run lint

      - name: Check No Stubs (check-no-stubs.js)
        run: node scripts/ci/check-no-stubs.js

      - name: Check No Legacy Code (check-no-legacy.js)
        run: node scripts/ci/check-no-legacy.js

      - name: Check Doc Links Integrity (check-doc-links.js)
        run: node scripts/ci/check-doc-links.js

      - name: Scan Banned Vocabulary (scan-banned-terms.js)
        run: node scripts/ci/scan-banned-terms.js

      - name: Route Inventory Drift Check (generate-route-inventory.js --check)
        env:
          NODE_PATH: ${{ github.workspace }}/proctornet/backend/node_modules:${{ github.workspace }}/proctornet/node_modules
          DATABASE_URL: postgresql://postgres:password@localhost:5432/dummy?schema=public
          JWT_SECRET: dummy_secret_for_route_inventory_introspection_32_bytes
        run: node scripts/ci/generate-route-inventory.js --check

  # ----------------------------------------------------------------------------
  # Stage 2: Database Migration Integrity & Clean Replay
  # ----------------------------------------------------------------------------
  migrations:
    name: Database Migration & Schema Alignment
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: proctornet_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: proctornet/package-lock.json

      - name: Install Backend Dependencies
        working-directory: proctornet
        run: npm ci

      - name: Apply Migrations from Baseline
        working-directory: proctornet/backend
        env:
          DATABASE_URL: postgresql://postgres:password@localhost:5432/proctornet_ci?schema=public
          DIRECT_URL: postgresql://postgres:password@localhost:5432/proctornet_ci?schema=public
        run: npx prisma migrate deploy

      - name: Verify Strict Migration Diff (Zero Schema Drift)
        working-directory: proctornet/backend
        env:
          DATABASE_URL: postgresql://postgres:password@localhost:5432/proctornet_ci?schema=public
          DIRECT_URL: postgresql://postgres:password@localhost:5432/proctornet_ci?schema=public
        run: |
          npx prisma migrate diff \
            --from-schema-datasource prisma/schema.prisma \
            --to-schema-datamodel prisma/schema.prisma \
            --exit-code

  # ----------------------------------------------------------------------------
  # Stage 3: Full Automated Test Suites (Unit, Integration, Security, Resilience)
  # ----------------------------------------------------------------------------
  test:
    name: Full Test Suite Execution
    needs: [quality, migrations]
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: proctornet_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      rabbitmq:
        image: rabbitmq:3.12-alpine
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics check_running"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            proctornet/package-lock.json

      - name: Install Dependencies
        run: |
          npm ci
          cd proctornet && npm ci

      - name: Generate Prisma Client & Migrate
        working-directory: proctornet/backend
        env:
          DATABASE_URL: postgresql://postgres:password@localhost:5432/proctornet_ci?schema=public
          DIRECT_URL: postgresql://postgres:password@localhost:5432/proctornet_ci?schema=public
          ADMIN_EMAIL: admin@proctornet.com
          ADMIN_PASSWORD: Admin@12345
        run: |
          npx prisma generate
          npx prisma migrate deploy
          node prisma/seed/admin.js

      - name: Run Backend Integration & Security Tests
        working-directory: proctornet/backend
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://postgres:password@localhost:5432/proctornet_ci?schema=public
          DIRECT_URL: postgresql://postgres:password@localhost:5432/proctornet_ci?schema=public
          REDIS_URL: redis://localhost:6379
          RABBITMQ_URL: amqp://guest:guest@localhost:5672
          JWT_SECRET: dummy_ci_jwt_secret_must_be_at_least_32_bytes_long_12345
          AWS_REGION: ap-south-1
          AWS_ACCESS_KEY_ID: dummy_ci_test_access_key_12345
          AWS_SECRET_ACCESS_KEY: dummy_ci_test_secret_key_12345
          AWS_S3_BUCKET_NAME: proctornet-ci-test-bucket
          S3_BUCKET: proctornet-ci-test-bucket
          S3_MOCK: "true"
          FACE_DRIVER: off
          AGENT_PAIRING_PEPPER: dummy_ci_pepper_test_secret_at_least_32_chars_123
          AGENT_POLICY_SIGNING_KEY: dummy_ci_signing_test_secret_at_least_32_chars_456
          PUBLIC_ORIGIN: http://localhost:5000
          LIVEKIT_API_KEY: devkey
          LIVEKIT_API_SECRET: secretsecretsecretsecretsecretsecret
          VPN_ENABLED: false
        run: |
          if [ ! -f ../../.env ]; then cp ../../.env.example ../../.env; fi
          node --test --test-force-exit tests/route-matrix.test.js
          node --test --test-force-exit tests/q5-bola-fuzz.test.js
          node --test --test-force-exit tests/q3-student-flow.test.js
          node --test --test-force-exit tests/q4-async-resilience.test.js
          node --test --test-force-exit tests/p3-schema-constraints.test.js
          node --test --test-force-exit tests/p4-state-machine.test.js
          node --test --test-force-exit tests/p4-concurrency-write-paths.test.js
          node --test --test-force-exit tests/p4-prewarm-500.test.js
          node --test --test-force-exit tests/p5-client-compression.test.js
          node --test --test-force-exit tests/p5-storage-evidence.test.js
          node --test --test-force-exit tests/p6-frontend-autosave.test.js
          node --test --test-force-exit tests/p6-realtime-invigilator.test.js
          node --test --test-force-exit tests/p7-media-livekit.test.js
          node --test --test-force-exit tests/p8-vpn-wireguard.test.js
          node --test --test-force-exit tests/p9-infrastructure-hardening.test.js
          node --test --test-force-exit tests/r1-face-verification.test.js
          node --test --test-force-exit tests/r2-evidence-invigilator.test.js
          node --test --test-force-exit tests/r3-media-cadence.test.js
          node --test --test-force-exit tests/r4-lite-profile-drivers.test.js
          node --test --test-force-exit tests/agent-adversarial.test.js
          node --test --test-force-exit tests/agent-legacy-gaps.test.js
          node --test --test-force-exit tests/agent-module.test.js
          node --test --test-force-exit tests/architecture.test.js
          node --test --test-force-exit tests/exam-lifecycle.test.js
          node --test --test-force-exit tests/mcq-validation.test.js
          node --test --test-force-exit tests/observability.test.js
          node --test --test-force-exit tests/security_auth_cookies.test.js
          node --test --test-force-exit tests/timezone-matrix.test.js

      - name: Run Root Flow & Security Unit Test Suites
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://postgres:password@localhost:5432/proctornet_ci?schema=public
          DIRECT_URL: postgresql://postgres:password@localhost:5432/proctornet_ci?schema=public
          JWT_SECRET: dummy_ci_jwt_secret_must_be_at_least_32_bytes_long_12345
          AWS_REGION: ap-south-1
          AWS_ACCESS_KEY_ID: dummy_ci_test_access_key_12345
          AWS_SECRET_ACCESS_KEY: dummy_ci_test_secret_key_12345
          AWS_S3_BUCKET_NAME: proctornet-ci-test-bucket
          S3_BUCKET: proctornet-ci-test-bucket
          S3_MOCK: "true"
          FACE_DRIVER: off
          NODE_PATH: ${{ github.workspace }}/proctornet/backend/node_modules:${{ github.workspace }}/proctornet/node_modules
        run: |
          if [ ! -f .env ]; then cp .env.example .env; fi
          node tests/approval_auth.test.js
          node tests/profile_security.test.js
          node tests/exam_credentials.test.js
          node tests/question_immutability.test.js
          node tests/ai_question_validation.test.js
          node tests/api_client.test.js
          node tests/feature_truth.test.js
          node tests/eligibility_matrix.test.js
          node tests/restart_chaos.test.js
          node tests/version_endpoint.test.js
          node tests/active_attempts_gate.test.js
          node tests/ci_workflow_integrity.test.js

  # ----------------------------------------------------------------------------
  # Stage 4: Frontend Production Build & Asset Verification
  # ----------------------------------------------------------------------------
  build-frontend:
    name: Frontend Build & Asset Verification
    needs: [quality]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: proctornet/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: proctornet
        run: npm ci

      - name: Build Frontend SPA
        working-directory: proctornet/frontend
        run: |
          npm run build
          test -d dist && test -f dist/index.html
          echo "[✓] Frontend production bundle verified."

  # ----------------------------------------------------------------------------
  # Stage 5: Security Audits & Vulnerability Scans
  # ----------------------------------------------------------------------------
  security-scan:
    name: Security Audits & Vulnerability Gates
    needs: [test, build-frontend]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Audit Backend Production Dependencies
        working-directory: proctornet/backend
        run: npm audit --omit=dev --audit-level=none

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Container for Scanning
        uses: docker/build-push-action@v5
        with:
          context: ./proctornet/backend
          file: ./proctornet/backend/Dockerfile
          load: true
          tags: proctornet-backend-scan:${{ github.sha }}

      - name: Scan Container Image with Trivy
        uses: aquasecurity/trivy-action@18f2510ee396bbf400402947b394f2dd8c87dbb0
        with:
          image-ref: proctornet-backend-scan:${{ github.sha }}
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL'
