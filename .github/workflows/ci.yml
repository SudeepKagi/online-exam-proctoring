name: CI Quality Gate & Verification

on:
  push:
    branches: [ main, 'feat/**', 'pilot/**', 'ci/**' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-typecheck-build:
    name: Lint, Typecheck & Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4.2.2

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4.2.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Verify Import Casing & File Paths
        run: node scripts/ci/check-import-casing.js

      - name: ESLint (Frontend & Backend)
        run: npm run lint

      - name: TypeScript Typecheck (Frontend & Backend)
        run: npm run typecheck

      - name: Generate Prisma Client
        run: npx prisma generate --schema=backend/prisma/schema.prisma

      - name: Build Production Frontend SPA
        run: npm run build

  migration-drift:
    name: Database Migration Drift Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: proctornet
          POSTGRES_PASSWORD: ci_drift_postgres_32char_secure_password_01
          POSTGRES_DB: proctornet_drift_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U proctornet -d proctornet_drift_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4.2.2

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4.2.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Apply Migrations to Ephemeral Database
        env:
          DATABASE_URL: postgresql://proctornet:ci_drift_postgres_32char_secure_password_01@127.0.0.1:5432/proctornet_drift_test?schema=public
          DIRECT_URL: postgresql://proctornet:ci_drift_postgres_32char_secure_password_01@127.0.0.1:5432/proctornet_drift_test?schema=public
        run: npx prisma migrate deploy --schema=backend/prisma/schema.prisma

      - name: Assert Zero Drift Between Schema and Deployed Migrations
        env:
          DATABASE_URL: postgresql://proctornet:ci_drift_postgres_32char_secure_password_01@127.0.0.1:5432/proctornet_drift_test?schema=public
          DIRECT_URL: postgresql://proctornet:ci_drift_postgres_32char_secure_password_01@127.0.0.1:5432/proctornet_drift_test?schema=public
        run: npx prisma migrate diff --from-schema-datasource backend/prisma/schema.prisma --to-schema-datamodel backend/prisma/schema.prisma --exit-code

  backend-tests:
    name: Backend Unit & Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [ lint-typecheck-build ]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: proctornet
          POSTGRES_PASSWORD: ci_test_postgres_32char_secure_password_01
          POSTGRES_DB: proctornet_e2e_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U proctornet -d proctornet_e2e_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

      redis:
        image: redis:7-alpine
        command: redis-server --requirepass ci_test_redis_32char_secure_password_01
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli -a ci_test_redis_32char_secure_password_01 ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4.2.2

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4.2.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Provision CI Test Environment (.env.test)
        run: |
          cat << 'EOF' > .env.test
          NODE_ENV=test
          PORT=5000
          INTERNAL_PORT=9100
          POSTGRES_PASSWORD=ci_test_postgres_32char_secure_password_01
          REDIS_PASSWORD=ci_test_redis_32char_secure_password_01
          DATABASE_URL=postgresql://proctornet:ci_test_postgres_32char_secure_password_01@127.0.0.1:5432/proctornet_e2e_test?schema=public
          DIRECT_URL=postgresql://proctornet:ci_test_postgres_32char_secure_password_01@127.0.0.1:5432/proctornet_e2e_test?schema=public
          REDIS_URL=redis://:ci_test_redis_32char_secure_password_01@127.0.0.1:6379
          CACHE_DRIVER=redis
          QUEUE_DRIVER=postgres
          START_WORKERS=true
          FACE_DRIVER=off
          FACE_VERIFIER_DRIVER=off
          COOKIE_SECURE=false
          E2E_PROFILE=prod-parity
          FRONTEND_URL=http://localhost:5173
          ALLOWED_ORIGINS=http://localhost:5173,http://127.0.0.1:5173
          PUBLIC_ORIGIN=http://localhost:5000
          JWT_SECRET=ci_throwaway_jwt_secret_at_least_32_characters_long_01
          S3_BUCKET=proctornet-storage
          AWS_REGION=ap-south-1
          S3_MOCK=true
          SEB_MODE=log
          SEB_CONFIG_KEY=
          SEB_LINK_SECRET=ci_throwaway_seb_link_secret_at_least_32_characters
          SEB_PRE_DOWNLOAD_MINUTES=30
          EXAM_CACHE_TTL_MS=0
          EOF

      - name: Prisma Generate & Migrate Deploy
        run: |
          npx prisma generate --schema=backend/prisma/schema.prisma
          npx prisma migrate deploy --schema=backend/prisma/schema.prisma

      - name: Baseline Admin Database Seed
        run: node backend/prisma/seed/admin.js

      - name: Run Backend Test Suites
        run: npm test --workspace=backend

  e2e:
    name: Playwright End-to-End Suite
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [ backend-tests ]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: proctornet
          POSTGRES_PASSWORD: ci_test_postgres_32char_secure_password_01
          POSTGRES_DB: proctornet_e2e_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U proctornet -d proctornet_e2e_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

      redis:
        image: redis:7-alpine
        command: redis-server --requirepass ci_test_redis_32char_secure_password_01
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli -a ci_test_redis_32char_secure_password_01 ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4.2.2

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4.2.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Provision CI Test Environment (.env.test)
        run: |
          cat << 'EOF' > .env.test
          NODE_ENV=test
          PORT=5000
          INTERNAL_PORT=9100
          POSTGRES_PASSWORD=ci_test_postgres_32char_secure_password_01
          REDIS_PASSWORD=ci_test_redis_32char_secure_password_01
          DATABASE_URL=postgresql://proctornet:ci_test_postgres_32char_secure_password_01@127.0.0.1:5432/proctornet_e2e_test?schema=public
          DIRECT_URL=postgresql://proctornet:ci_test_postgres_32char_secure_password_01@127.0.0.1:5432/proctornet_e2e_test?schema=public
          REDIS_URL=redis://:ci_test_redis_32char_secure_password_01@127.0.0.1:6379
          CACHE_DRIVER=redis
          QUEUE_DRIVER=postgres
          START_WORKERS=true
          FACE_DRIVER=off
          FACE_VERIFIER_DRIVER=off
          COOKIE_SECURE=false
          E2E_PROFILE=prod-parity
          FRONTEND_URL=http://localhost:5173
          ALLOWED_ORIGINS=http://localhost:5173,http://127.0.0.1:5173
          PUBLIC_ORIGIN=http://localhost:5000
          JWT_SECRET=ci_throwaway_jwt_secret_at_least_32_characters_long_01
          S3_BUCKET=proctornet-storage
          AWS_REGION=ap-south-1
          S3_MOCK=true
          SEB_MODE=log
          SEB_CONFIG_KEY=
          SEB_LINK_SECRET=ci_throwaway_seb_link_secret_at_least_32_characters
          SEB_PRE_DOWNLOAD_MINUTES=30
          EXAM_CACHE_TTL_MS=0
          EOF

      - name: Prisma Generate & Migrate Deploy
        run: |
          npx prisma generate --schema=backend/prisma/schema.prisma
          npx prisma migrate deploy --schema=backend/prisma/schema.prisma

      - name: Baseline Admin Database Seed
        run: node backend/prisma/seed/admin.js

      - name: Install Playwright Chromium Browser & OS Dependencies
        run: npx playwright install --with-deps chromium

      - name: Execute Playwright E2E Suite
        run: npx playwright test

      - name: Upload Playwright Test Artifacts on Failure
        if: failure()
        uses: actions/upload-artifact@v4.6.1
        with:
          name: playwright-e2e-artifacts
          path: |
            reports/e2e/
            test-results/
          retention-days: 14

  seb-smoke:
    name: Safe Exam Browser (SEB) Enforce Mode Smoke Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [ backend-tests ]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: proctornet
          POSTGRES_PASSWORD: ci_test_postgres_32char_secure_password_01
          POSTGRES_DB: proctornet_e2e_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U proctornet -d proctornet_e2e_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

      redis:
        image: redis:7-alpine
        command: redis-server --requirepass ci_test_redis_32char_secure_password_01
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli -a ci_test_redis_32char_secure_password_01 ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4.2.2

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4.2.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Provision SEB Enforce Test Environment (.env.test)
        run: |
          cat << 'EOF' > .env.test
          NODE_ENV=test
          PORT=5000
          INTERNAL_PORT=9100
          POSTGRES_PASSWORD=ci_test_postgres_32char_secure_password_01
          REDIS_PASSWORD=ci_test_redis_32char_secure_password_01
          DATABASE_URL=postgresql://proctornet:ci_test_postgres_32char_secure_password_01@127.0.0.1:5432/proctornet_e2e_test?schema=public
          DIRECT_URL=postgresql://proctornet:ci_test_postgres_32char_secure_password_01@127.0.0.1:5432/proctornet_e2e_test?schema=public
          REDIS_URL=redis://:ci_test_redis_32char_secure_password_01@127.0.0.1:6379
          CACHE_DRIVER=redis
          QUEUE_DRIVER=postgres
          START_WORKERS=true
          FACE_DRIVER=off
          FACE_VERIFIER_DRIVER=off
          COOKIE_SECURE=false
          E2E_PROFILE=prod-parity
          FRONTEND_URL=http://localhost:5173
          ALLOWED_ORIGINS=http://localhost:5173,http://127.0.0.1:5173
          PUBLIC_ORIGIN=http://localhost:5000
          JWT_SECRET=ci_throwaway_jwt_secret_at_least_32_characters_long_01
          S3_BUCKET=proctornet-storage
          AWS_REGION=ap-south-1
          S3_MOCK=true
          SEB_MODE=enforce
          SEB_CONFIG_KEY=a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4e5f6a1b2
          SEB_LINK_SECRET=ci_throwaway_seb_link_secret_at_least_32_characters
          SEB_PRE_DOWNLOAD_MINUTES=30
          EXAM_CACHE_TTL_MS=0
          EOF

      - name: Prisma Generate & Migrate Deploy
        run: |
          npx prisma generate --schema=backend/prisma/schema.prisma
          npx prisma migrate deploy --schema=backend/prisma/schema.prisma

      - name: Seed Admin Accounts
        run: node backend/prisma/seed/admin.js

      - name: Start Backend Service in Background
        run: |
          node --env-file=.env.test backend/src/app.js &
          sleep 4

      - name: Execute SEB Smoke Verification (403 Without Header, 200 With Valid Header)
        run: node scripts/ci/seb-smoke-check.js

  security:
    name: Security Scans & Repository Hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0

      - name: Assert No Tracked .env Files in Repository
        run: |
          TRACKED_ENV=$(git ls-files | grep -E '(^|/)\.env($|\..*)' | grep -v '\.example' || true)
          if [ -n "$TRACKED_ENV" ]; then
            echo "SECURITY REFUSAL: The following unredacted .env files are committed in Git:"
            echo "$TRACKED_ENV"
            exit 1
          fi
          echo "Verified: Zero sensitive .env files tracked in Git."

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4.2.0
        with:
          node-version-file: '.nvmrc'

      - name: Dependency Vulnerability Audit (High & Critical)
        run: npm audit --audit-level=high

      - name: Gitleaks Secret Scanner
        uses: gitleaks/gitleaks-action@v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
