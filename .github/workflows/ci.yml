name: ProctorNet Scalability & Quality CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-format:
    name: Lint & Conventions
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: proctornet/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: proctornet

      - name: Run ESLint
        run: npm run lint
        working-directory: proctornet/backend

  test-suite:
    name: Automated Unit, Security & Regression Suite
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: proctornet_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: proctornet/package-lock.json

      - name: Install Backend Dependencies
        run: npm ci
        working-directory: proctornet/backend

      - name: Run Prisma Generate
        run: npx prisma generate
        working-directory: proctornet/backend
        env:
          DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5432/proctornet_test?schema=public

      - name: Execute Automated Test Suite (68 Tests)
        run: npm test
        working-directory: proctornet/backend
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5432/proctornet_test?schema=public
          JWT_SECRET: ci_test_jwt_secret_key_proctornet_2026

  k6-smoke:
    name: k6 Concurrency Smoke Test
    runs-on: ubuntu-latest
    needs: [test-suite]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: proctornet_k6
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: proctornet/package-lock.json

      - name: Install k6
        run: |
          sudo gpg -k
          sudo gpg --no-default-keyring --keyring /usr/share/keyrings/k6-archive-keyring.gpg --keyserver hkp://keyserver.ubuntu.com:80 --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update
          sudo apt-get install -y k6

      - name: Install Backend Dependencies
        run: npm ci
        working-directory: proctornet/backend

      - name: Run Prisma Migrations
        run: npx prisma db push --skip-generate
        working-directory: proctornet/backend
        env:
          DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5432/proctornet_k6?schema=public

      - name: Seed Smoke Test Fixture
        run: node scripts/seed_loadtest_fixture.js --students 10
        working-directory: proctornet/backend
        env:
          DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5432/proctornet_k6?schema=public
          LOADTEST_ALLOW: "1"

      - name: Start API Server in Background
        run: node src/app.js &
        working-directory: proctornet/backend
        env:
          PORT: 5000
          DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5432/proctornet_k6?schema=public
          JWT_SECRET: ci_k6_jwt_secret_key_2026
          NODE_ENV: production

      - name: Wait for API Readiness
        run: |
          for i in {1..30}; do
            curl -s http://127.0.0.1:5000/health && break
            echo "Waiting for backend..."
            sleep 1
          done

      - name: Run k6 Smoke Test
        run: k6 run scripts/k6_exam_simulation.js --env VUS=10 --env DURATION=10s
        working-directory: proctornet/backend
