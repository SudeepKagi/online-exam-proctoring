name: Rollback Production Release

on:
  workflow_dispatch:
    inputs:
      target_release:
        description: 'Specific release ID to revert to (e.g., release-v1.0.5). Leave blank to revert to immediately previous release.'
        required: false
        default: ''
      reason:
        description: 'Mandatory operational reason for rollback'
        required: true
        default: 'Production health check failure or defect remediation'

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  rollback:
    name: Execute Rollback via AWS SSM
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://proctornet.duckdns.org

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || 'ap-south-1' }}

      - name: Execute Rollback Command via AWS SSM
        run: |
          INSTANCE_ID="${{ secrets.AWS_EC2_INSTANCE_ID }}"
          TARGET_RELEASE="${{ github.event.inputs.target_release }}"
          REASON="${{ github.event.inputs.reason }}"

          echo "=========================================================="
          echo " Dispatching Rollback on Instance: ${INSTANCE_ID}"
          echo " Target Release: ${TARGET_RELEASE:-PREVIOUS}"
          echo " Audit Reason:   ${REASON}"
          echo "=========================================================="

          # Build rollback command string
          ROLLBACK_CMD="
          set -eo pipefail
          BASE_DIR='/opt/proctornet'
          CURRENT_LINK=\"\$BASE_DIR/current\"
          RELEASES_DIR=\"\$BASE_DIR/releases\"

          echo '[ROLLBACK] Initiated at \$(date -u +\"%Y-%m-%dT%H:%M:%SZ\")'
          echo '[ROLLBACK] Reason: ${REASON}'

          if [ -n \"${TARGET_RELEASE}\" ]; then
            TARGET_DIR=\"\$RELEASES_DIR/${TARGET_RELEASE}\"
            if [ ! -d \"\$TARGET_DIR\" ]; then
              echo '[x] Error: Target release \$TARGET_DIR does not exist on host.'
              exit 1
            fi
          else
            # Derive previous release directory from current link
            if [ -L \"\$CURRENT_LINK\" ]; then
              CURRENT_TARGET=\$(readlink -f \"\$CURRENT_LINK\")
              # Pick the most recent release directory that is not the current one
              TARGET_DIR=\$(ls -dt \$RELEASES_DIR/*/ | grep -v \"\$CURRENT_TARGET\" | head -n 1 | tr -d '/')
            fi
          fi

          if [ -z \"\$TARGET_DIR\" ] || [ ! -d \"\$TARGET_DIR\" ]; then
            echo '[x] Error: No valid previous release directory found for rollback.'
            exit 1
          fi

          echo \"[ROLLBACK] Reverting active symlink to: \$TARGET_DIR\"
          ln -sfn \"\$TARGET_DIR\" \"\$CURRENT_LINK\"

          echo '[ROLLBACK] Restarting systemd service: proctornet'
          systemctl restart proctornet

          echo '[ROLLBACK] Verifying rollback health (/healthz)...'
          sleep 3
          HEALTH=\$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:5000/healthz || true)
          if [ \"\$HEALTH\" = '200' ]; then
            echo \"[ROLLBACK ✓] Service is 200 OK on release: \$(basename \$TARGET_DIR)\"
          else
            echo \"[ROLLBACK x] Critical: Service returned status \$HEALTH after rollback.\"
            exit 1
          fi
          "

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${INSTANCE_ID}" \
            --document-name "AWS-RunShellScript" \
            --comment "Production rollback: ${REASON}" \
            --parameters "commands=[${ROLLBACK_CMD@Q}]" \
            --output text \
            --query "Command.CommandId")

          echo "SSM Command dispatched with ID: ${COMMAND_ID}"
          echo "Polling execution status..."

          for i in {1..30}; do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "${COMMAND_ID}" \
              --instance-id "${INSTANCE_ID}" \
              --query "Status" \
              --output text 2>/dev/null || echo "Pending")

            echo "Poll attempt ${i}/30: Status=${STATUS}"

            if [ "${STATUS}" = "Success" ]; then
              echo "=========================================================="
              echo "[✓] Rollback completed successfully on instance!"
              echo "=========================================================="
              aws ssm get-command-invocation \
                --command-id "${COMMAND_ID}" \
                --instance-id "${INSTANCE_ID}" \
                --query "StandardOutputContent" \
                --output text
              exit 0
            elif [ "${STATUS}" = "Failed" ] || [ "${STATUS}" = "Cancelled" ] || [ "${STATUS}" = "TimedOut" ]; then
              echo "=========================================================="
              echo "[x] Rollback failed or timed out!"
              echo "=========================================================="
              aws ssm get-command-invocation \
                --command-id "${COMMAND_ID}" \
                --instance-id "${INSTANCE_ID}" \
                --query "StandardErrorContent" \
                --output text || true
              aws ssm get-command-invocation \
                --command-id "${COMMAND_ID}" \
                --instance-id "${INSTANCE_ID}" \
                --query "StandardOutputContent" \
                --output text || true
              exit 1
            fi

            sleep 5
          done

          echo "[x] Rollback timed out waiting for SSM completion."
          exit 1
