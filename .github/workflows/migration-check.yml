name: Database Migration Integrity Check

on:
  push:
    branches: [ main ]
    paths:
      - 'proctornet/backend/prisma/**'
      - '.github/workflows/migration-check.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'proctornet/backend/prisma/**'
      - '.github/workflows/migration-check.yml'

jobs:
  verify-migrations:
    name: Verify Clean Baseline Migration Diff
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: postgresql://postgres:password@localhost:5432/proctornet_ci?schema=public
      DIRECT_URL: postgresql://postgres:password@localhost:5432/proctornet_ci?schema=public

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: proctornet_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: proctornet/package-lock.json

      - name: Install dependencies
        working-directory: proctornet
        run: npm ci

      - name: Run Prisma Migrate Deploy
        working-directory: proctornet/backend
        env:
          DATABASE_URL: postgresql://postgres:password@localhost:5432/proctornet_ci?schema=public
          DIRECT_URL: postgresql://postgres:password@localhost:5432/proctornet_ci?schema=public
        run: npx prisma migrate deploy

      - name: Verify Migration Status
        working-directory: proctornet/backend
        env:
          DATABASE_URL: postgresql://postgres:password@localhost:5432/proctornet_ci?schema=public
          DIRECT_URL: postgresql://postgres:password@localhost:5432/proctornet_ci?schema=public
        run: npx prisma migrate status

      - name: Verify Schema Matches Migrations (migrate diff)
        working-directory: proctornet/backend
        env:
          DATABASE_URL: postgresql://postgres:password@localhost:5432/proctornet_ci?schema=public
          DIRECT_URL: postgresql://postgres:password@localhost:5432/proctornet_ci?schema=public
        run: |
          npx prisma migrate diff \
            --from-schema-datasource prisma/schema.prisma \
            --to-schema-datamodel prisma/schema.prisma \
            --script > diff.sql
          
          if grep -E "CREATE TABLE|DROP TABLE|ALTER TABLE.*DROP COLUMN|ALTER TABLE.*ADD COLUMN" diff.sql; then
            echo "❌ Schema drift detected between Prisma schema and migration baseline!"
            cat diff.sql
            exit 1
          else
            echo "✅ Schema is perfectly aligned with baseline migrations."
          fi
