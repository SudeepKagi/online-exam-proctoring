name: Nightly Maintenance & Hygiene

on:
  schedule:
    - cron: '0 2 * * *' # Every night at 02:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  security-scan:
    name: Security Audits & Vulnerability Gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Workspace
        uses: ./.github/actions/setup

      - name: Check Documentation Links
        run: node scripts/ci/check-doc-links.js

      - name: Check Claims Ledger Integrity
        run: node scripts/ci/check-ledger.js

      - name: Audit Backend Production Dependencies
        working-directory: proctornet/backend
        run: npm audit --omit=dev --audit-level=high

      - name: Trivy Vulnerability Scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          severity: 'CRITICAL'
          exit-code: '0'

  standard-profile:
    name: Standard Profile Tests (Redis/RabbitMQ)
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
      rabbitmq:
        image: rabbitmq:3.13-alpine
        ports:
          - 5672:5672
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: proctornet_ci
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4
      - name: Setup Workspace
        uses: ./.github/actions/setup
      - name: Run Standard Profile Suite
        env:
          APP_PROFILE: standard
          REDIS_URL: redis://localhost:6379
          RABBITMQ_URL: amqp://guest:guest@localhost:5672
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/proctornet_ci?schema=public
        run: |
          npx prisma migrate deploy --schema=proctornet/backend/prisma/schema.prisma
          node scripts/ci/run-tests.js --profile standard || true

  # Companion-agent journeys (j3 + j4) require 420s+ — run nightly, not on push
  companion-e2e:
    name: Companion Journey E2E (j3 + j4)
    runs-on: ubuntu-latest
    continue-on-error: true
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: proctornet_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d proctornet_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
      minio:
        image: pgsty/silo:latest
        command: server /data --console-address ":9001"
        env:
          MINIO_ROOT_USER: minioadmin
          MINIO_ROOT_PASSWORD: minioadmin
        ports:
          - 9000:9000
        options: >-
          --health-cmd "curl -f http://localhost:9000/minio/health/live"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Setup Workspace
        uses: ./.github/actions/setup
      - name: Apply Migrations and Seed
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/proctornet_ci?schema=public
          DIRECT_URL: postgresql://postgres:postgres@localhost:5432/proctornet_ci?schema=public
        run: |
          npx prisma migrate deploy --schema=proctornet/backend/prisma/schema.prisma
          node proctornet/backend/prisma/seed/admin.js
      - name: Create MinIO Bucket
        working-directory: proctornet/backend
        run: |
          node -e "
            const { S3Client, CreateBucketCommand } = require('@aws-sdk/client-s3');
            const s3 = new S3Client({ endpoint: 'http://localhost:9000', region: 'us-east-1', credentials: { accessKeyId: 'minioadmin', secretAccessKey: 'minioadmin' }, forcePathStyle: true });
            s3.send(new CreateBucketCommand({ Bucket: 'proctornet-storage-test' })).then(() => console.log('ok')).catch(e => console.log(e.message));
          "
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium
      - name: Run Companion Journeys (j3 and j4)
        env:
          CI: "true"
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/proctornet_ci?schema=public
          DIRECT_URL: postgresql://postgres:postgres@localhost:5432/proctornet_ci?schema=public
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: ci_unified_dummy_jwt_secret_must_be_at_least_32_bytes_long_12345
          S3_ENDPOINT: http://localhost:9000
          S3_BUCKET: proctornet-storage-test
          S3_BUCKET_NAME: proctornet-storage-test
          S3_FORCE_PATH_STYLE: "true"
          AWS_REGION: us-east-1
          AWS_ACCESS_KEY_ID: minioadmin
          AWS_SECRET_ACCESS_KEY: minioadmin
          FACE_DRIVER: test
          FACE_VERIFIER_DRIVER: test
          COOKIE_SECURE: "false"
        run: |
          xvfb-run --auto-servernum --server-args="-screen 0 1440x900x24" npx playwright test \
            e2e/journeys/j3-student-happy-path.spec.ts \
            e2e/journeys/j4-identity-paths.spec.ts \
            --project=chromium
