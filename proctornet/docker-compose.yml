version: '3.8'

services:
  # -------------------------------------------------------------
  # LiveKit SFU WebRTC Media Server (Pinned stable v1.13.7)
  # Production note: In Linux production environments, deploy with
  # `network_mode: host` to eliminate Docker NAT overhead.
  # -------------------------------------------------------------
  livekit:
    image: livekit/livekit-server:v1.13.7
    container_name: proctornet-livekit
    command: --config /etc/livekit.yaml
    environment:
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-proctornet_livekit_key}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-proctornet_livekit_secret_at_least_32_chars}
    ports:
      - "7880:7880"       # WebRTC signaling / HTTP
      - "7881:7881"       # ICE TCP fallback
      - "7882:7882/udp"   # Single UDP media multiplexer port
      - "3478:3478/udp"   # TURN UDP
      - "5349:5349"       # TURN TLS
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml
    networks:
      - proctornet-net
    restart: always

  # -------------------------------------------------------------
  # MinIO Object Storage (Self-Hosted S3 Snapshots & Buffer Store)
  # -------------------------------------------------------------
  minio:
    image: minio/minio:RELEASE.2024-01-31T03-24-00Z
    container_name: proctornet-minio
    profiles:
      - dev
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadminpassword
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-storage:/data
    networks:
      - proctornet-net
    restart: always

  # -------------------------------------------------------------
  # Exadel CompreFace Stack (Free, Open-Source Face Recognition)
  # -------------------------------------------------------------
  compreface-postgres-db:
    image: postgres:13-alpine
    container_name: compreface-postgres-db
    environment:
      POSTGRES_DB: compreface
      POSTGRES_USER: compreface
      POSTGRES_PASSWORD: compreface_password
    volumes:
      - compreface-db-data:/var/lib/postgresql/data
    networks:
      - proctornet-net
    restart: always

  compreface-admin:
    image: exadel/compreface-admin:1.2.0
    container_name: compreface-admin
    environment:
      - POSTGRES_URL=jdbc:postgresql://compreface-postgres-db:5432/compreface
      - POSTGRES_USER=compreface
      - POSTGRES_PASSWORD=compreface_password
      - SAVE_IMAGES_TO_DB=true
    ports:
      - "8000:8080"
    depends_on:
      - compreface-postgres-db
    networks:
      - proctornet-net
    restart: always

  compreface-api:
    image: exadel/compreface-api:1.2.0
    container_name: compreface-api
    environment:
      - POSTGRES_URL=jdbc:postgresql://compreface-postgres-db:5432/compreface
      - POSTGRES_USER=compreface
      - POSTGRES_PASSWORD=compreface_password
      - SAVE_IMAGES_TO_DB=true
    depends_on:
      - compreface-postgres-db
      - compreface-admin
    networks:
      - proctornet-net
    restart: always

  compreface-core:
    image: exadel/compreface-core:1.2.0
    container_name: compreface-core
    environment:
      - compreface.service.api=http://compreface-api:8080
    depends_on:
      - compreface-api
    networks:
      - proctornet-net
    restart: always

  # -------------------------------------------------------------
  # ProctorNet Application Stack
  # -------------------------------------------------------------
  postgres:
    image: postgres:15-alpine
    container_name: proctornet-db
    environment:
      POSTGRES_DB: proctornet
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - proctornet-db-data:/var/lib/postgresql/data
    networks:
      - proctornet-net
    restart: always

  python-service:
    build:
      context: ./python-service
    container_name: proctornet-python
    ports:
      - "5001:5001"
    environment:
      - PORT=5001
      - COMPREFACE_URL=http://compreface-admin:8080
    networks:
      - proctornet-net
    restart: always

  backend:
    build:
      context: ./backend
    container_name: proctornet-backend
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - DATABASE_URL=postgresql://postgres:postgrespassword@postgres:5432/proctornet?schema=public
      - PYTHON_SERVICE_URL=http://python-service:5001
      - COMPREFACE_URL=http://compreface-admin:8080
      - LIVEKIT_API_KEY=devkey
      - LIVEKIT_API_SECRET=secretsecretsecretsecretsecretsecret
      - MINIO_ENDPOINT=minio
      - MINIO_PORT=9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadminpassword
      - JWT_SECRET=proctornet_super_secret_jwt_key_2026
    depends_on:
      - postgres
      - python-service
      - compreface-admin
      - minio
      - livekit
    networks:
      - proctornet-net
    restart: always

  frontend:
    build:
      context: ./frontend
    container_name: proctornet-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - proctornet-net
    restart: always

  # -------------------------------------------------------------
  # Observability Stack (Prometheus + Grafana Dashboards)
  # Run via: docker compose --profile observability up -d
  # -------------------------------------------------------------
  prometheus:
    image: prom/prometheus:v2.50.1
    container_name: proctornet-prometheus
    profiles:
      - observability
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    ports:
      - "9090:9090"
    volumes:
      - ../ops/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks:
      - proctornet-net
    restart: always

  grafana:
    image: grafana/grafana:10.3.3
    container_name: proctornet-grafana
    profiles:
      - observability
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ../ops/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../ops/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - proctornet-net
    restart: always

networks:
  proctornet-net:
    driver: bridge

volumes:
  compreface-db-data:
  proctornet-db-data:
  minio-storage:
  prometheus-data:
  grafana-data:
