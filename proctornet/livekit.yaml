# Reference to canonical LiveKit SFU config in ops/livekit/livekit.yaml
port: 7880
bind_addresses:
  - ""

rtc:
  tcp_port: 7881
  udp_port: 7882
  use_external_ip: false
  interfaces:
    includes:
      - eth0
      - wg0
  congestion_control:
    enabled: true

room:
  auto_create: false
  empty_timeout: 300
  max_participants: 1200

keys:
  devkey: secretsecretsecretsecretsecretsecret
  proctornet_livekit_key: proctornet_livekit_secret_at_least_32_chars

webhook:
  api_key: proctornet_livekit_key
  urls:
    - http://127.0.0.1:5000/internal/livekit/webhook

logging:
  json: true
  level: info
