# ─────────────────────────────────────────────────────────────
# ProctorNet Minimal CI Service Stack (Prompt 11 / V3.4)
# Postgres 16 + MinIO S3 for hermetic CI and npm run ci:local
# ─────────────────────────────────────────────────────────────

version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: proctornet-ci-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: proctornet_ci
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d proctornet_ci"]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 2s
    volumes:
      - postgres-ci-data:/var/lib/postgresql/data

  minio:
    image: minio/minio:latest
    container_name: proctornet-ci-minio
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 2s
    volumes:
      - minio-ci-data:/data

  minio-init:
    image: minio/mc:latest
    container_name: proctornet-ci-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set local http://minio:9000 minioadmin minioadmin;
      /usr/bin/mc mb --ignore-existing local/proctornet-storage-test;
      exit 0;
      "

volumes:
  postgres-ci-data:
  minio-ci-data:
