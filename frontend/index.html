<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- SEO -->
    <title>ProctorNet — Online Exam Proctoring</title>
    <meta name="description" content="Online examination proctoring platform with identity verification, live monitoring, and a secure exam mode." />
    <meta name="keywords" content="online examination proctoring, identity verification, live monitoring, secure exam mode, objective evaluation, integrity insights" />
    <meta name="author" content="ProctorNet" />

    <!-- Open Graph -->
    <meta property="og:title" content="ProctorNet — Online Exam Proctoring" />
    <meta property="og:description" content="Online examination proctoring platform with identity verification, live monitoring, and a secure exam mode." />
    <meta property="og:type" content="website" />

    <!-- Typography: Inter, Plus Jakarta Sans, DM Sans & JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400..700;1,9..40,400..700&family=Inter:wght@300;360;400;420;480;500;600;700&family=JetBrains+Mono:ital,wght@0,400..700;1,400..700&family=Plus+Jakarta+Sans:ital,wght@0,600..800;1,600..800&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet" />

    <!-- Prevent exam page indexing (security) -->
    <meta name="robots" content="noindex, nofollow" />

    <!-- Force Light Theme & Refresh Safety -->
    <script>
      (function() {
        try {
          localStorage.setItem('theme', 'light');
          document.documentElement.classList.remove('dark');
          document.documentElement.classList.add('light');
        } catch (e) {}
        if (typeof window.$RefreshSig$ === 'undefined') {
          window.$RefreshSig$ = function() { return function(type) { return type; }; };
        }
        if (typeof window.$RefreshReg$ === 'undefined') {
          window.$RefreshReg$ = function() {};
        }
      })();
    </script>
  </head>
  <body class="bg-[#fbfcfd] text-[#28253b] antialiased">
    <div id="root"></div>
    <!-- PDF.js for client-side document text extraction -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script>if(window.pdfjsLib) window.pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js'</script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
