services:
  postgres:
    image: postgres:16-alpine
    container_name: proctornet-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: proctornet
      POSTGRES_PASSWORD: proctornet_password
      POSTGRES_DB: proctornet
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U proctornet -d proctornet"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: proctornet-redis
    restart: unless-stopped
    command: redis-server --protected-mode no
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: proctornet-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://proctornet:proctornet_password@postgres:5432/proctornet?schema=public
      DIRECT_URL: postgresql://proctornet:proctornet_password@postgres:5432/proctornet?schema=public
      REDIS_URL: redis://redis:6379
      JWT_SECRET: supersecret_jwt_proctornet_production_key_32bytes
      JWT_REFRESH_SECRET: supersecret_jwt_refresh_proctornet_key_32bytes
      CORS_ORIGIN: https://proctornet.duckdns.org,http://localhost:5173,http://localhost:80,http://localhost:8080,http://127.0.0.1:5173,http://127.0.0.1:80
      ALLOWED_ORIGINS: https://proctornet.duckdns.org,http://localhost:5173,http://localhost:80,http://localhost:8080,http://127.0.0.1:5173,http://127.0.0.1:80
      S3_BUCKET: proctornet-production-evidence
      AWS_REGION: ap-south-1
      CACHE_DRIVER: redis
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:5000/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 15s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: proctornet-frontend
    restart: unless-stopped
    ports:
      - "5173:8080"
      - "80:8080"
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3

volumes:
  postgres_data:
  redis_data:
