# ==============================================================================
# ProctorNet Production-Parity E2E Stack (§4.2)
# Real PostgreSQL 16, MinIO (real S3 presigned), Lite Backend (QUEUE_DRIVER=postgres,
# CACHE_DRIVER=memory, START_WORKERS=true, FACE_DRIVER=test), Caddy (tls internal),
# Real Device Agent
# ==============================================================================

services:
  postgres:
    image: postgres:16-alpine
    container_name: proctornet-e2e-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: e2e_password_secure
      POSTGRES_DB: proctornet_e2e
    ports:
      - "5434:5432"
    networks:
      - e2e-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d proctornet_e2e"]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 3s

  minio:
    image: minio/minio:RELEASE.2024-01-18T22-51-28Z
    container_name: proctornet-e2e-minio
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    networks:
      - e2e-net
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:9000/minio/health/live || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 5s

  minio-setup:
    image: minio/mc:RELEASE.2024-01-16T16-06-34Z
    container_name: proctornet-e2e-minio-setup
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - e2e-net
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin;
      mc mb local/proctornet-evidence --ignore-existing;
      mc anonymous set download local/proctornet-evidence;
      exit 0;
      "

  backend:
    build:
      context: ./proctornet/backend
      dockerfile: Dockerfile
    container_name: proctornet-e2e-backend
    restart: unless-stopped
    environment:
      PORT: 5000
      INTERNAL_PORT: 9100
      NODE_ENV: production
      APP_PROFILE: lite
      QUEUE_DRIVER: postgres
      CACHE_DRIVER: memory
      MEDIA_DRIVER: snapshot
      FACE_DRIVER: test
      START_WORKERS: "true"
      LLM_DRIVER: fake
      DATABASE_URL: postgresql://postgres:e2e_password_secure@postgres:5432/proctornet_e2e?schema=public
      DIRECT_URL: postgresql://postgres:e2e_password_secure@postgres:5432/proctornet_e2e?schema=public
      JWT_SECRET: e2e_parity_secret_key_at_least_64_characters_long_for_security_checks
      JWT_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 7d
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: proctornet-evidence
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      AWS_REGION: us-east-1
      VPN_ENABLED: "false"
    ports:
      - "5000:5000"
      - "9100:9100"
    networks:
      - e2e-net
    depends_on:
      postgres:
        condition: service_healthy
      minio-setup:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:5000/healthz || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

  caddy:
    image: caddy:2.8-alpine
    container_name: proctornet-e2e-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./ops/caddy/Caddyfile.e2e:/etc/caddy/Caddyfile:ro
      - ./proctornet/frontend/dist:/srv/frontend:ro
    networks:
      - e2e-net
    depends_on:
      backend:
        condition: service_healthy

networks:
  e2e-net:
    driver: bridge
